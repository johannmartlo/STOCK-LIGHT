name: CI - Test & Concurrency Validation

on:
  push:
    branches:
      - feature/ci-postgres-validation
  pull_request:

permissions:
  contents: read

jobs:
  postgres-validation:
    name: PostgreSQL migrations and concurrency
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: stocklight_ci
          POSTGRES_PASSWORD: stocklight_ci
          POSTGRES_DB: stocklight_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stocklight_ci -d stocklight_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      APP_ENV: test
      TEST_DATABASE_URL: postgresql://stocklight_ci:stocklight_ci@127.0.0.1:5432/stocklight_ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Apply PostgreSQL migrations
        run: python -m db.migrate

      - name: Verify final schema version
        run: python -m db.migrate --status

      - name: Run existing core Node tests
        run: |
          node test/inventory_engine.test.js
          node test/movement_service.test.js

      - name: Run PostgreSQL integration tests
        run: python -m pytest -q
