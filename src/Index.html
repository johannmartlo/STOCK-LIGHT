  <script>
    (function () {
      // --- ACCESO (T-020): token del enlace y estado del PIN, renderizados por doGet ---
      const elementoEntrada = document.getElementById('pantallaEntrada');
      const TOKEN_INICIAL = elementoEntrada ? String(elementoEntrada.getAttribute('data-token') || '') : '';
      const PIN_YA_CONFIGURADO = !!elementoEntrada && elementoEntrada.getAttribute('data-tiene-pin') === '1';
      const LS_TOKEN = 'sl_token';
      const LS_PIN_PREFIX = 'sl_pin_';

      // --- PUENTE SEGURO DE API (CLIENTE-SERVIDOR) ---
      const api = {
        call: function (fnName, ...args) {
          return new Promise(function (resolve, reject) {
            if (typeof google !== 'undefined' && google.script && google.script.run) {
              google.script.run
                .withSuccessHandler(function (res) {
                  if (res && res.success === false && res.errorCode === 'SESION_INVALIDA') {
                    cerrarSesionLocal('Tu sesión ha caducado. Vuelve a entrar.');
                    reject(new Error('SESION_INVALIDA'));
                    return;
                  }
                  resolve(res);
                })
                .withFailureHandler(function (err) {
                  reject(new Error(err && err.message ? err.message : String(err)));
                })
                .apiLlamar(state.sesion, fnName, args);
            } else if (window.localApiBridge) {
              window.localApiBridge(fnName, args, resolve, reject);
            } else {
              reject(new Error('Backend no conectado (entorno estático).'));
            }
          });
        },
        // Las funciones de ENTRADA (sin sesión) se llaman directamente; no pasan por apiLlamar.
        entrada: function (fnName, ...args) {
          return new Promise(function (resolve, reject) {
            if (typeof google !== 'undefined' && google.script && google.script.run) {
              google.script.run
                .withSuccessHandler(resolve)
                .withFailureHandler(function (err) {
                  reject(new Error(err && err.message ? err.message : String(err)));
                })
                [fnName](...args);
            } else if (window.localApiBridge) {
              window.localApiBridge(fnName, args, resolve, reject);
            } else {
              reject(new Error('Backend no conectado (entorno estático).'));
            }
          });
        }
      };

      const state = {
        sesion: null,
        usuario: null
      };
      window.SLBridge = api;

      // --- ACCESO: ENLACE PERSONAL + PIN (T-020) ---
      let tokenAcceso = '';
      let modoEntrada = 'sin-token';
      let pinBuffer = '';
      let pinConfirmadoOk = false;

      function leerAlmacen(clave) {
        try { return window.localStorage.getItem(clave) || ''; } catch (e) { return ''; }
      }

      function guardarAlmacen(clave, valor) {
        try { window.localStorage.setItem(clave, valor); } catch (e) {}
      }

      function borrarAlmacen(clave) {
        try { window.localStorage.removeItem(clave); } catch (e) {}
      }

      function quitarTokenDeUrl() {
        // El token no debe quedarse en la barra de direcciones (T-020, regla 8).
        try {
          if (typeof google !== 'undefined' && google.script && google.script.history && google.script.history.replace) {
            google.script.history.replace(null, {}, '');
            return;
          }
        } catch (e) {}
        try {
          if (window.history && window.history.replaceState) {
            const url = new URL(window.location.href);
            url.searchParams.delete('k');
            window.history.replaceState({}, document.title, url.pathname + url.search + url.hash);
          }
        } catch (e) {}
      }

      function pinYaConfigurado(token) {
        if (!token) return false;
        if (PIN_YA_CONFIGURADO && token === TOKEN_INICIAL) return true;
        return leerAlmacen(LS_PIN_PREFIX + token) === '1';
      }

      function marcarPinConfigurado(token) {
        if (token) guardarAlmacen(LS_PIN_PREFIX + token, '1');
      }

      function inicialesNombre(nombre) {
        const parts = String(nombre || '').trim().split(/\s+/).filter(Boolean);
        if (parts.length === 0) return 'SL';
        if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
        return (parts[0][0] + parts[1][0]).toUpperCase();
      }

      function actualizarPinDisplay() {
        const pinEl = document.getElementById('entradaPin');
        const boton = document.getElementById('btnEntradaConfirmar');
        if (pinEl) {
          const totalPuntos = Math.max(4, pinBuffer.length);
          let html = '';
          for (let i = 0; i < totalPuntos; i++) {
            const cls = i < pinBuffer.length
              ? ('entrada-pin-dot sl-dot ' + (pinConfirmadoOk ? 'ok' : 'filled'))
              : 'entrada-pin-dot';
            html += '<span class="' + cls + '"></span>';
          }
          pinEl.innerHTML = html;
          pinEl.setAttribute('aria-label', pinBuffer.length + ' de 4 cifras');
        }
        if (boton) boton.disabled = pinBuffer.length < 4;
      }

      function mostrarErrorEntrada(mensaje) {
        const errorEl = document.getElementById('entradaError');
        if (errorEl) errorEl.textContent = mensaje || '';
      }

      function aplicarModoEntrada() {
        const titulo = document.getElementById('entradaTitulo');
        const texto = document.getElementById('entradaTexto');
        const pinEl = document.getElementById('entradaPin');
        const teclado = document.getElementById('entradaTeclado');
        const boton = document.getElementById('btnEntradaConfirmar');
        const cambiar = document.getElementById('btnCambiarModo');

        pinBuffer = '';
        pinConfirmadoOk = false;
        mostrarErrorEntrada('');
        actualizarPinDisplay();

        if (modoEntrada === 'sin-token') {
          if (titulo) titulo.textContent = 'Acceso con enlace';
          if (texto) texto.textContent = 'Abre tu enlace personal. Pide a quien administra Stock Light que te envíe tu enlace.';
          if (pinEl) pinEl.classList.add('entrada-oculta');
          if (teclado) teclado.classList.add('entrada-oculta');
          if (boton) boton.classList.add('entrada-oculta');
          if (cambiar) cambiar.classList.add('entrada-oculta');
          return;
        }

        if (pinEl) pinEl.classList.remove('entrada-oculta');
        if (teclado) teclado.classList.remove('entrada-oculta');
        if (boton) {
          boton.classList.remove('entrada-oculta');
          boton.textContent = modoEntrada === 'crear' ? 'Crear PIN' : 'Entrar';
        }

        if (modoEntrada === 'crear') {
          if (titulo) titulo.textContent = 'Elige tu PIN';
          if (texto) texto.textContent = 'Escribe un PIN de 4 a 6 cifras para entrar desde este enlace.';
          if (cambiar) {
            cambiar.textContent = 'Ya tengo PIN';
            cambiar.classList.remove('entrada-oculta');
          }
        } else {
          if (titulo) titulo.textContent = 'Hola de nuevo';
          if (texto) texto.textContent = 'Escribe tu PIN de 4 cifras';
          if (cambiar) cambiar.classList.add('entrada-oculta');
        }
      }

      function configurarModoEntrada() {
        tokenAcceso = TOKEN_INICIAL || leerAlmacen(LS_TOKEN);
        modoEntrada = !tokenAcceso ? 'sin-token' : (pinYaConfigurado(tokenAcceso) ? 'entrar' : 'crear');
        aplicarModoEntrada();
      }

      function obtenerSesionDeRespuesta(res) {
        if (!res || !res.sesion) return null;
        return {
          sesion: String(res.sesion),
          nombre: String(res.nombre || ''),
          rol: String(res.rol || '')
        };
      }

      function entrarEnApp(datos) {
        state.sesion = datos.sesion;
        state.usuario = { nombre: datos.nombre, rol: datos.rol };

        const pantalla = document.getElementById('pantallaEntrada');
        const appEl = document.getElementById('app');
        const lblUsuario = document.getElementById('lblUsuario');
        const lblAvatar = document.getElementById('lblUsuarioAvatar');
        const lblAvatarMob = document.getElementById('lblUsuarioAvatarMob');
        const btnSalir = document.getElementById('btnSalir');
        const btnSalirMob = document.getElementById('btnSalirMob');

        if (pantalla) pantalla.style.display = 'none';
        if (appEl) appEl.style.display = 'flex';
        const initTxt = inicialesNombre(datos.nombre);
        if (lblAvatar) lblAvatar.textContent = initTxt;
        if (lblAvatarMob) lblAvatarMob.textContent = initTxt;
        if (lblUsuario) {
          lblUsuario.textContent = datos.nombre || 'Usuario';
          lblUsuario.title = datos.nombre ? (datos.nombre + ' · ' + datos.rol) : '';
          lblUsuario.style.display = 'inline-block';
        }
        if (btnSalir) btnSalir.style.display = 'inline-flex';
        if (btnSalirMob) btnSalirMob.style.display = 'inline-flex';

        pinBuffer = '';
        pinConfirmadoOk = false;
        mostrarErrorEntrada('');

        if (window.SLApp && typeof window.SLApp.aplicarRol === 'function') {
          window.SLApp.aplicarRol(datos.rol);
        } else if (document.body) {
          document.body.classList.toggle('sl-rol-consulta', String(datos.rol || '').trim().toUpperCase() === 'CONSULTA');
        }

        if (window.SLApp && typeof window.SLApp.cargarInicio === 'function') {
          window.SLApp.cargarInicio();
        }
      }

      function cerrarSesionLocal(mensaje) {
        state.sesion = null;
        state.usuario = null;

        const pantalla = document.getElementById('pantallaEntrada');
        const appEl = document.getElementById('app');
        const lblUsuario = document.getElementById('lblUsuario');
        const btnSalir = document.getElementById('btnSalir');
        const btnSalirMob = document.getElementById('btnSalirMob');

        if (appEl) appEl.style.display = 'none';
        if (pantalla) pantalla.style.display = 'flex';
        if (lblUsuario) lblUsuario.style.display = 'none';
        if (btnSalir) btnSalir.style.display = 'none';
        if (btnSalirMob) btnSalirMob.style.display = 'none';

        configurarModoEntrada();
        if (mensaje) mostrarErrorEntrada(mensaje);
      }

      function pulsarDigito(digito) {
        if (modoEntrada !== 'crear' && modoEntrada !== 'entrar') return;
        const limpio = String(digito || '').replace(/\D/g, '');
        if (!limpio || pinBuffer.length >= 6) return;
        pinBuffer += limpio;
        pinConfirmadoOk = false;
        mostrarErrorEntrada('');
        actualizarPinDisplay();
      }

      function borrarDigito() {
        pinBuffer = pinBuffer.slice(0, -1);
        pinConfirmadoOk = false;
        actualizarPinDisplay();
      }

      function confirmarPin() {
        if (modoEntrada !== 'crear' && modoEntrada !== 'entrar') return;
        if (pinBuffer.length < 4 || pinBuffer.length > 6) return;

        const pin = pinBuffer;
        const boton = document.getElementById('btnEntradaConfirmar');
        if (boton) boton.disabled = true;
        mostrarErrorEntrada('');

        const fnEntrada = modoEntrada === 'crear' ? 'apiEstablecerPin' : 'apiEntrar';

        api.entrada(fnEntrada, tokenAcceso, pin)
          .then(function (res) {
            const datos = obtenerSesionDeRespuesta(res);
            if (datos) {
              pinConfirmadoOk = true;
              actualizarPinDisplay();
              marcarPinConfigurado(tokenAcceso);
              entrarEnApp(datos);
              return;
            }

            pinBuffer = '';
            pinConfirmadoOk = false;
            actualizarPinDisplay();
            mostrarErrorEntrada('No se pudo entrar. Comprueba el enlace y el PIN.');
          })
          .catch(function () {
            pinBuffer = '';
            pinConfirmadoOk = false;
            actualizarPinDisplay();
            mostrarErrorEntrada('No se pudo conectar. Inténtalo de nuevo.');
          })
          .finally(function () {
            if (boton) boton.disabled = false;
            actualizarPinDisplay();
          });
      }

      function salir() {
        if (!state.sesion) {
          cerrarSesionLocal('');
          return;
        }
        const sesion = state.sesion;
        api.call('apiSalir', sesion).then(
          function () {
            cerrarSesionLocal('Has salido. Vuelve a entrar con tu PIN.');
          },
          function () {
            cerrarSesionLocal('Has salido de este dispositivo. Vuelve a entrar con tu PIN.');
          }
        );
      }

      function iniciarEntrada() {
        if (TOKEN_INICIAL) {
          guardarAlmacen(LS_TOKEN, TOKEN_INICIAL);
          if (PIN_YA_CONFIGURADO) {
            marcarPinConfigurado(TOKEN_INICIAL);
          } else {
            borrarAlmacen(LS_PIN_PREFIX + TOKEN_INICIAL);
          }
          quitarTokenDeUrl();
        }
        configurarModoEntrada();
        const pantalla = document.getElementById('pantallaEntrada');
        const appEl = document.getElementById('app');
        if (pantalla) pantalla.style.display = 'flex';
        if (appEl) appEl.style.display = 'none';
      }

      function init() {
        document.querySelectorAll('#entradaTeclado [data-digito]').forEach(btn => {
          btn.addEventListener('click', () => pulsarDigito(btn.dataset.digito));
        });
        const btnBorrarPin = document.querySelector('#entradaTeclado [data-accion="borrar"]');
        if (btnBorrarPin) btnBorrarPin.addEventListener('click', borrarDigito);
        const btnConfirmarPin = document.getElementById('btnEntradaConfirmar');
        if (btnConfirmarPin) btnConfirmarPin.addEventListener('click', confirmarPin);
        const btnCambiarModo = document.getElementById('btnCambiarModo');
        if (btnCambiarModo) {
          btnCambiarModo.addEventListener('click', () => {
            if (modoEntrada === 'crear') {
              modoEntrada = 'entrar';
              aplicarModoEntrada();
            }
          });
        }
        const btnSalir = document.getElementById('btnSalir');
        const btnSalirMob = document.getElementById('btnSalirMob');
        if (btnSalir) btnSalir.addEventListener('click', salir);
        if (btnSalirMob) btnSalirMob.addEventListener('click', salir);

        document.addEventListener('keydown', function (e) {
          const pantalla = document.getElementById('pantallaEntrada');
          if (!pantalla || pantalla.style.display === 'none') return;
          if (/^[0-9]$/.test(e.key)) pulsarDigito(e.key);
          else if (e.key === 'Backspace') borrarDigito();
          else if (e.key === 'Enter') confirmarPin();
        });

        iniciarEntrada();

        if (window.__SL_PREVIEW_AUTO_LOGIN__) {
          entrarEnApp(window.__SL_PREVIEW_AUTO_LOGIN__);
        }
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }
    })();
  </script>
