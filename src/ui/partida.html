<section id="viewPartida" class="sl-partida-page sl-hidden" aria-label="Detalle de partida">
  <div style="display:flex;align-items:center;gap:10px">
    <button type="button" id="btnVolverPartida" aria-label="Volver" style="width:44px;height:44px;border-radius:12px;background:var(--sl-panel);border:1px solid var(--sl-line);color:var(--sl-text);display:flex;align-items:center;justify-content:center;cursor:pointer">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg>
    </button>
    <span id="partidaBreadcrumb" style="font-size:14px;color:var(--sl-text-secondary)">Partida</span>
  </div>

  <!-- Estado cargando partida -->
  <div id="partidaCargando" class="sl-hidden" style="margin-top:14px;display:flex;flex-direction:column;gap:12px">
    <div class="sl-sk" style="height:180px;border-radius:14px"></div>
    <div class="sl-sk" style="height:160px;border-radius:14px"></div>
  </div>

  <!-- Estado error partida -->
  <div id="partidaError" class="sl-partida-card sl-hidden">
    <div style="font-size:16px;font-weight:600;color:var(--sl-red)">No se pudo cargar la partida</div>
    <div id="partidaErrorMsg" style="font-size:13px;color:var(--sl-text-secondary);margin-top:6px"></div>
    <button type="button" id="btnReintentarPartida" class="sl-btn" style="margin-top:14px">Reintentar</button>
  </div>

  <!-- Contenido de partida -->
  <div id="partidaContenido" class="sl-hidden">
    <div class="sl-up sl-partida-card">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">
        <div style="display:flex;align-items:center;gap:10px;min-width:0">
          <div id="partidaColorBox" style="width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:none">
            <div id="partidaColorDot" style="width:18px;height:18px;border-radius:50%"></div>
          </div>
          <div style="min-width:0">
            <div id="partidaArticulo" style="font-weight:700;font-size:17px"></div>
            <div id="partidaEnvase" style="font-size:13px;color:var(--sl-text-secondary)"></div>
          </div>
        </div>
        <span id="partidaBadgeOrigen" style="display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;border-radius:999px;padding:5px 10px"></span>
      </div>

      <div style="display:flex;align-items:baseline;gap:8px;margin-top:18px">
        <span id="partidaCajasRestantes" style="font-size:52px;font-weight:700;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums">0</span>
        <span id="partidaCajasUnidad" style="color:var(--sl-text-secondary);font-size:15px">cajas</span>
      </div>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px;font-size:13px">
        <div style="background:rgba(255,255,255,.05);border-radius:12px;padding:10px 12px">
          <div style="color:var(--sl-text-secondary)">Fecha FIFO</div>
          <div id="partidaFechaFifo" style="font-weight:600;margin-top:2px"></div>
        </div>
        <div style="background:rgba(255,255,255,.05);border-radius:12px;padding:10px 12px">
          <div style="color:var(--sl-text-secondary)">Agricultor</div>
          <div id="partidaAgricultor" style="font-weight:600;margin-top:2px"></div>
        </div>
      </div>
    </div>

    <div class="sl-up sl-partida-card" style="border-color:var(--sl-line-strong);animation-delay:120ms">
      <div style="font-size:12px;font-weight:600;letter-spacing:.06em;color:#A4ACB9">DE DÓNDE VIENE</div>
      <div id="partidaOrigenTimeline" style="margin-top:14px"></div>
    </div>

    <div class="sl-up sl-partida-card" style="animation-delay:200ms">
      <div style="font-size:12px;font-weight:600;letter-spacing:.06em;color:var(--sl-text-secondary)">QUÉ HA PASADO DESPUÉS</div>
      <div id="partidaDespuesBody" style="margin-top:10px"></div>
    </div>
  </div>

  <div class="sl-partida-footer">
    <div class="sl-partida-footer-inner">
      <button type="button" data-proxima-version="1" class="sl-btn" style="height:50px;border-radius:14px;font-size:15px;font-weight:700">⇄ Cambiar</button>
      <button type="button" id="btnPartidaSecundario" data-proxima-version="1" style="height:50px;border-radius:14px;background:var(--sl-bg);color:var(--sl-red);border:1px solid rgba(248,113,113,.35);font:700 15px var(--sl-font);cursor:pointer">Destrío</button>
    </div>
  </div>
</section>
