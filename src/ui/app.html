<script>
  (function () {
    const SL = {
      inicio: null,
      ultimoOkAt: null,
      periodo: '30',
      filtroModo: 'todas',
      busqueda: '',
      rol: '',
      hoverIdx: null,
      variedadAbierta: null,
      partidaActual: null,
      estadoForzado: null,
      toastTimer: null
    };

    const SIGLAS_LEGIBLES = new Set(['G', 'GG', 'GGG', 'M', 'MM', 'MMM', 'I', 'II', 'EPS', 'POOL']);

    function fmt(n) {
      return String(Math.round(Number(n) || 0)).replace(/\B(?=(\d{3})+(?!\d))/g, '.');
    }

    function fmtSigned(n) {
      const val = Math.round(Number(n) || 0);
      if (val > 0) return '+' + fmt(val);
      if (val < 0) return '−' + fmt(Math.abs(val));
      return '0';
    }

    function pluraliza(n, singular, plural) {
      const val = Math.round(Number(n) || 0);
      return fmt(val) + ' ' + (Math.abs(val) === 1 ? singular : plural);
    }

    function fmtDias(n) {
      const val = Math.max(0, Math.round(Number(n) || 0));
      if (val === 0) return 'hoy';
      if (val === 1) return '1 día';
      return fmt(val) + ' días';
    }

    function normalizarBusqueda(texto) {
      return String(texto === null || texto === undefined ? '' : texto)
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .toLowerCase()
        .trim();
    }

    function nombreLegible(texto) {
      if (texto === null || texto === undefined) return '';
      const raw = String(texto).trim();
      if (!raw) return '';
      return raw.split(/(\s*[·→]\s*)/).map(function (parte) {
        if (/^\s*[·→]\s*$/.test(parte)) return parte;
        const sinTomate = parte.trim().replace(/^TOMATE\s+/i, '');
        if (!sinTomate) return '';
        return sinTomate.split(/\s+/).map(function (palabra) {
          const upper = palabra.toUpperCase();
          if (SIGLAS_LEGIBLES.has(upper)) return upper;
          if (/^\d+(?:[.,]\d+)?[xX]\d+(?:[.,]\d+)?[a-zA-Z]*$/.test(palabra)) {
            return palabra.toLowerCase();
          }
          if (/^\d+(?:[.,]\d+)?(?:G|KG|ML|L|CM|MM)$/i.test(palabra)) {
            return palabra.toLowerCase();
          }
          return palabra.charAt(0).toUpperCase() + palabra.slice(1).toLowerCase();
        }).join(' ');
      }).join('');
    }

    function etiquetaArticuloEnVariedad(articulo, grupo) {
      const artLeg = nombreLegible(articulo);
      if (!artLeg || !grupo) return artLeg;
      const artWords = artLeg.split(/\s+/);
      const grpWords = nombreLegible(grupo).split(/\s+/);
      let matchCount = 0;
      while (
        matchCount < artWords.length &&
        matchCount < grpWords.length &&
        normalizarBusqueda(artWords[matchCount]) === normalizarBusqueda(grpWords[matchCount])
      ) {
        matchCount++;
      }
      if (matchCount > 0 && matchCount < artWords.length) {
        return artWords.slice(matchCount).join(' ');
      }
      return artLeg;
    }

    function calcularDesgloseArticulos(v) {
      const partidas = (v && Array.isArray(v.partidas)) ? v.partidas : [];
      const mapa = new Map();
      partidas.forEach(function (p) {
        const art = String(p.articulo || '').trim();
        const env = String(p.envase || '').trim();
        const clave = art + '|' + env;
        if (!mapa.has(clave)) {
          mapa.set(clave, { articulo: art, envase: env, cajas: 0 });
        }
        mapa.get(clave).cajas += Number(p.cajas || 0);
      });
      return Array.from(mapa.values()).sort(function (a, b) {
        if (b.cajas !== a.cajas) return b.cajas - a.cajas;
        const cmpArt = a.articulo.localeCompare(b.articulo);
        if (cmpArt !== 0) return cmpArt;
        return a.envase.localeCompare(b.envase);
      });
    }

    function construirTextoWhatsApp(v, fechaReferencia) {
      if (!v) return '';
      const fecha = fmtFechaDdMm(fechaReferencia || (SL.inicio && SL.inicio.fecha_referencia) || '');
      const cajasNum = Number(v.cajas || 0);
      const linea1 = nombreLegible(v.grupo) + ' · ' + fecha + ' · ' + pluraliza(cajasNum, 'caja', 'cajas');

      const desglose = calcularDesgloseArticulos(v);
      const linea2 = desglose.map(function (item) {
        const artLbl = etiquetaArticuloEnVariedad(item.articulo, v.grupo);
        const envLbl = nombreLegible(item.envase);
        return [artLbl, envLbl, fmt(item.cajas)].filter(Boolean).join(' ');
      }).join(' · ');

      const lineas = [linea1];
      if (linea2) lineas.push(linea2);
      if (v.sale_primero) {
        lineas.push('Sale primero: ' + fmtFechaDdMm(v.sale_primero));
      }
      return lineas.join('\n');
    }

    function compartirVariedadWhatsApp(v) {
      const texto = construirTextoWhatsApp(v, SL.inicio && SL.inicio.fecha_referencia);
      if (!texto) return;
      const url = 'https://wa.me/?text=' + encodeURIComponent(texto);
      window.open(url, '_blank', 'noopener,noreferrer');
    }

    function copiarFallback(texto) {
      try {
        const ta = document.createElement('textarea');
        ta.value = texto;
        ta.setAttribute('readonly', 'readonly');
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        mostrarAviso('Texto copiado');
      } catch (e) {
        mostrarAviso('No se pudo copiar el texto');
      }
    }

    function copiarVariedad(v) {
      const texto = construirTextoWhatsApp(v, SL.inicio && SL.inicio.fecha_referencia);
      if (!texto) return;
      if (typeof navigator !== 'undefined' && navigator.clipboard && typeof navigator.clipboard.writeText === 'function') {
        navigator.clipboard.writeText(texto).then(
          function () { mostrarAviso('Texto copiado'); },
          function () { copiarFallback(texto); }
        );
      } else {
        copiarFallback(texto);
      }
    }

    function aplicarRol(rol) {
      const rolNorm = String(rol || '').trim().toUpperCase();
      SL.rol = rolNorm;
      const esConsulta = rolNorm === 'CONSULTA';
      const esAdmin = rolNorm === 'ADMIN';
      if (typeof document !== 'undefined' && document.body) {
        document.body.classList.toggle('sl-rol-consulta', esConsulta);
        document.body.classList.toggle('sl-rol-admin', esAdmin);
        document.querySelectorAll('[data-solo-escritura="1"]').forEach(function (el) {
          if (esConsulta) el.setAttribute('hidden', 'hidden');
          else el.removeAttribute('hidden');
        });
        document.querySelectorAll('[data-solo-admin="1"]').forEach(function (el) {
          if (!esAdmin) el.setAttribute('hidden', 'hidden');
          else el.removeAttribute('hidden');
        });
      }
    }

    // --- T-028: Codificación CSV, orden automático y pantallas Importar / Pendientes ---

    const SLImp = {
      archivos: [], // { id, nombre, texto, codificacion, preview, tipoOrden, error }
      confirmando: false,
      stockInicialTexto: '',
      stockInicialPreview: null,
      pendientesData: null,
      gruposComerciales: [],
      confirmarDecisionClave: null
    };

    /**
     * Decodifica bytes de un CSV probando primero UTF-8; si aparecen caracteres de
     * reemplazo (U+FFFD, «»), vuelve a decodificar en windows-1252 (T-028 regla 2).
     * Los fixtures de test/fixtures/csv/ están en UTF-8 sin BOM; los CSV reales de
     * Hispatec en Windows suelen venir en windows-1252.
     */
    function decodificarBytesCsv(bufferOrBytes) {
      const bytes = bufferOrBytes instanceof Uint8Array
        ? bufferOrBytes
        : new Uint8Array(bufferOrBytes || []);
      let textoUtf8 = '';
      if (typeof TextDecoder !== 'undefined') {
        textoUtf8 = new TextDecoder('utf-8', { fatal: false }).decode(bytes);
      } else {
        for (let i = 0; i < bytes.length; i++) textoUtf8 += String.fromCharCode(bytes[i]);
      }
      if (textoUtf8.indexOf('\uFFFD') >= 0) {
        if (typeof TextDecoder !== 'undefined') {
          try {
            const textoWin = new TextDecoder('windows-1252').decode(bytes);
            return { texto: textoWin, codificacion: 'windows-1252' };
          } catch (e) {
            // Fallback Latin-1 si el runtime no tiene tabla windows-1252
          }
        }
        let latin = '';
        for (let i = 0; i < bytes.length; i++) latin += String.fromCharCode(bytes[i]);
        return { texto: latin, codificacion: 'windows-1252' };
      }
      return { texto: textoUtf8, codificacion: 'utf-8' };
    }

    function leerArchivoCsvConCodificacion(file) {
      return new Promise(function (resolve, reject) {
        if (typeof FileReader === 'undefined') {
          reject(new Error('FileReader no disponible en este navegador.'));
          return;
        }
        const reader = new FileReader();
        reader.onload = function () {
          try {
            if (reader.result instanceof ArrayBuffer) {
              resolve(decodificarBytesCsv(new Uint8Array(reader.result)));
              return;
            }
            const textoUtf8 = String(reader.result || '');
            if (textoUtf8.indexOf('\uFFFD') >= 0) {
              const readerWin = new FileReader();
              readerWin.onload = function () {
                resolve({ texto: String(readerWin.result || ''), codificacion: 'windows-1252' });
              };
              readerWin.onerror = function () {
                reject(new Error('No se pudo leer el archivo en windows-1252.'));
              };
              readerWin.readAsText(file, 'windows-1252');
            } else {
              resolve({ texto: textoUtf8, codificacion: 'utf-8' });
            }
          } catch (err) {
            reject(err);
          }
        };
        reader.onerror = function () {
          reject(new Error('No se pudo leer el archivo ' + (file && file.name ? file.name : '')));
        };
        if (typeof reader.readAsArrayBuffer === 'function' && typeof TextDecoder !== 'undefined') {
          reader.readAsArrayBuffer(file);
        } else {
          reader.readAsText(file, 'UTF-8');
        }
      });
    }

    function detectarTipoArchivoCsv(item) {
      const tipoPrev = item && item.preview && item.preview.tipoCsv
        ? String(item.preview.tipoCsv).trim().toUpperCase()
        : (item && item.tipoCsv ? String(item.tipoCsv).trim().toUpperCase() : '');
      if (tipoPrev === 'COMPRA' || tipoPrev === 'COMPRAS' || tipoPrev === 'ENTRADA' || tipoPrev === 'RECEPCION' || tipoPrev === 'RECEPCIONES') return 'COMPRA';
      if (tipoPrev === 'SALIDA' || tipoPrev === 'VENTA' || tipoPrev === 'VENTAS') return 'SALIDA';
      const texto = String((item && item.texto) || '');
      const primera = texto.split(/\r?\n/)[0] || '';
      if (/FechaRecepcion|Recepci[oó]n/i.test(primera)) return 'COMPRA';
      if (/NombreEmisor|CantidadEnvasesAC|FechaAlbaran/i.test(primera)) return 'COMPRA';
      if (/NombreCliente|NroEnvases|RefAV/i.test(primera)) return 'SALIDA';
      const nombre = String((item && item.nombre) || '');
      if (/compra|recepci/i.test(nombre)) return 'COMPRA';
      if (/venta/i.test(nombre)) return 'SALIDA';
      return 'DESCONOCIDO';
    }

    function prioridadTipoCsv(tipo) {
      if (tipo === 'COMPRA') return 0;
      if (tipo === 'SALIDA') return 1;
      return 2;
    }

    function ordenarArchivosImportacion(archivos) {
      const lista = Array.isArray(archivos) ? archivos : [];
      return lista
        .map(function (item, idx) {
          const tipo = detectarTipoArchivoCsv(item);
          return { item: item, idx: idx, prio: prioridadTipoCsv(tipo) };
        })
        .sort(function (a, b) {
          if (a.prio !== b.prio) return a.prio - b.prio;
          return a.idx - b.idx;
        })
        .map(function (w) { return w.item; });
    }

    function agruparSeguimientoDesconocido(bloque) {
      const docs = (bloque && Array.isArray(bloque.documentos)) ? bloque.documentos : [];
      const mapa = new Map();
      docs.forEach(function (doc) {
        (doc.lineas || []).forEach(function (l) {
          const art = String(l.articulo || '').trim();
          const env = String(l.envase || '').trim();
          const clave = art + '|' + env;
          if (!mapa.has(clave)) {
            mapa.set(clave, {
              clave: clave,
              articulo: art,
              envase: env,
              lineas: 0,
              cajas: 0,
              documentos: new Set()
            });
          }
          const grp = mapa.get(clave);
          grp.lineas += 1;
          grp.cajas += Math.abs(Number(l.cajas || 0));
          grp.documentos.add((doc.serie || '') + '/' + (doc.numero || ''));
        });
      });
      return Array.from(mapa.values())
        .map(function (g) {
          return {
            clave: g.clave,
            articulo: g.articulo,
            envase: g.envase,
            lineas: g.lineas,
            cajas: g.cajas,
            documentos: Array.from(g.documentos)
          };
        })
        .sort(function (a, b) { return b.cajas - a.cajas; });
    }

    function actualizarBadgesPendientes(total) {
      const n = Math.max(0, Number(total || 0));
      ['navPendientesBadge', 'navPendientesConsultaBadge', 'tabPendientesBadge'].forEach(function (id) {
        const el = document.getElementById(id);
        if (!el) return;
        if (n > 0) {
          el.textContent = String(n);
          el.classList.remove('sl-hidden');
        } else {
          el.classList.add('sl-hidden');
        }
      });
      const pill = document.getElementById('pendTotalBadge');
      if (pill) pill.textContent = String(n);
    }

    function actualizarNavActivo(vista) {
      const mapa = {
        existencias: 'navExistencias',
        partida: 'navExistencias',
        cambiar: 'navCambios',
        importar: 'navImportar',
        pendientes: SL.rol === 'CONSULTA' ? 'navPendientes' : 'navImportar',
        movimientos: 'navMovimientos',
        parte: 'navParte'
      };
      const activoId = mapa[vista] || 'navExistencias';
      ['navExistencias', 'navCambios', 'navImportar', 'navPendientes', 'navMovimientos', 'navParte'].forEach(function (id) {
        const el = document.getElementById(id);
        if (!el) return;
        if (id === activoId) el.setAttribute('aria-current', 'page');
        else el.removeAttribute('aria-current');
      });
    }

    function mostrarVista(vista) {
      cerrarDetalleVariedadSilencioso();
      setVisibilidad('viewExistencias', vista === 'existencias');
      setVisibilidad('viewPartida', vista === 'partida');
      setVisibilidad('viewCambiar', vista === 'cambiar');
      setVisibilidad('viewImportar', vista === 'importar');
      setVisibilidad('viewPendientes', vista === 'pendientes');
      if (window.SLMov) window.SLMov.setVisible(vista === 'movimientos');
      if (window.SLParte) window.SLParte.setVisible(vista === 'parte');
      actualizarNavActivo(vista);
    }

    function cerrarDetalleVariedadSilencioso() {
      SL.variedadAbierta = null;
      setVisibilidad('panelBackdrop', false);
      setVisibilidad('panelVariedad', false);
      setVisibilidad('hojaVariedad', false);
    }

    function activarPestanaImportar(tab) {
      const esStock = tab === 'stock_inicial' && SL.rol === 'ADMIN';
      setVisibilidad('panelImpCsv', !esStock);
      setVisibilidad('panelStockInicial', esStock);
      const tCsv = document.getElementById('tabImpCsv');
      const tSi = document.getElementById('tabImpStockInicial');
      if (tCsv) tCsv.setAttribute('aria-selected', esStock ? 'false' : 'true');
      if (tSi) tSi.setAttribute('aria-selected', esStock ? 'true' : 'false');
    }

    function abrirImportar(tabInicial) {
      if (SL.rol === 'CONSULTA') {
        abrirPendientes();
        return;
      }
      mostrarVista('importar');
      activarPestanaImportar(tabInicial === 'stock_inicial' ? 'stock_inicial' : 'csv');
    }

    function abrirPendientes() {
      mostrarVista('pendientes');
      cargarPendientes();
    }

    function abrirMovimientos(filtros) {
      mostrarVista('movimientos');
      if (window.SLMov) window.SLMov.cargar(filtros || {});
    }

    function abrirParte() {
      mostrarVista('parte');
      if (window.SLParte) window.SLParte.cargar();
    }

    function abrirBuscar(texto) {
      if (window.SLBuscar) window.SLBuscar.abrir(texto || '');
    }

    function rangoFechasDocumentos(docs) {
      const fechas = (Array.isArray(docs) ? docs : [])
        .map(function (d) { return d && d.fecha ? String(d.fecha) : ''; })
        .filter(Boolean)
        .sort();
      if (fechas.length === 0) return '';
      if (fechas[0] === fechas[fechas.length - 1]) return fmtFechaDdMm(fechas[0]);
      return fmtFechaDdMm(fechas[0]) + ' – ' + fmtFechaDdMm(fechas[fechas.length - 1]);
    }

    function parseNumEsSimple(v) {
      const s = String(v === null || v === undefined ? '' : v).trim().replace(/\./g, '').replace(',', '.');
      const n = Number(s);
      return Number.isFinite(n) ? n : 0;
    }

    /**
     * Calcula cajas informativas por albarán (serie/numero) a partir del texto CSV
     * para mostrar cifras en la previsualización y el resultado (sin recalcular stock).
     */
    function resumirCajasPorAlbaranCsv(textoCsv) {
      const mapa = new Map();
      const lineas = String(textoCsv || '').replace(/^\uFEFF/, '').split(/\r?\n/).filter(function (l) { return l.trim() !== ''; });
      if (lineas.length < 2) return mapa;
      const cab = lineas[0].split(';').map(function (h) { return normalizarBusqueda(h); });
      const idxSerie = cab.indexOf('seriealbaran');
      const idxNum = cab.indexOf('numeroalbaran') >= 0 ? cab.indexOf('numeroalbaran') : cab.indexOf('numero');
      const idxAlb = cab.indexOf('albaran');
      const idxCajas = cab.indexOf('cantidadenvasesac') >= 0 ? cab.indexOf('cantidadenvasesac') : cab.indexOf('nroenvases');
      if (idxCajas < 0) return mapa;

      for (let i = 1; i < lineas.length; i++) {
        const cols = lineas[i].split(';');
        let serie = idxSerie >= 0 ? String(cols[idxSerie] || '').trim() : '';
        let numero = idxNum >= 0 ? String(cols[idxNum] || '').trim() : '';
        if (!serie && idxAlb >= 0) {
          const m = String(cols[idxAlb] || '').trim().match(/^([A-Za-z0-9]+)\/(\d+)/);
          if (m) {
            serie = m[1];
            if (!numero) numero = m[2];
          }
        }
        const clave = (serie + '/' + numero).toUpperCase();
        const cj = parseNumEsSimple(cols[idxCajas]);
        if (cj > 0) {
          mapa.set(clave, (mapa.get(clave) || 0) + Math.round(cj));
        }
      }
      return mapa;
    }

    function construirHtmlPrevisualizacionImportacion(archivos) {
      const ordenados = ordenarArchivosImportacion(archivos);
      const hayComprasEnLote = ordenados.some(function (a) {
        return a && !a.error && detectarTipoArchivoCsv(a) === 'COMPRA';
      });

      let hayAlgoConfirmable = false;
      const html = ordenados.map(function (archivo, idx) {
        if (archivo.error) {
          return (
            '<div class="sl-imp-file-card">' +
            '<div class="sl-imp-file-head">' +
            '<div class="sl-file-icon-box" style="background:rgba(248,113,113,.14);color:var(--sl-red)">!</div>' +
            '<div style="min-width:0;flex:1">' +
            '<div style="font-weight:600;word-break:break-word">' + esc(archivo.nombre) + '</div>' +
            '<div style="font-size:12px;color:var(--sl-red)">' + esc(archivo.error) + '</div>' +
            '</div></div></div>'
          );
        }

        const prev = archivo.preview || {};
        const tipo = detectarTipoArchivoCsv(archivo);
        const esCompra = tipo === 'COMPRA';
        const esVenta = tipo === 'SALIDA';
        const diferirComprobacionStock = esVenta && hayComprasEnLote;
        const tipoLabel = esCompra ? 'Compras' : (esVenta ? 'Ventas' : 'CSV');
        const docs = Array.isArray(prev.documentos) ? prev.documentos : [];
        const porEstado = (prev.resumen && prev.resumen.porEstado) || {};
        const totalLineas = (prev.resumen && prev.resumen.totalLineas) || 0;
        const rango = rangoFechasDocumentos(docs);

        const docsNuevos = docs.filter(function (d) { return d.estado === 'NUEVO'; });
        const docsYa = docs.filter(function (d) { return d.estado === 'YA_IMPORTADO'; });
        const docsMod = docs.filter(function (d) { return d.estado === 'MODIFICADO_EN_ERP'; });
        const docsSinStock = docs.filter(function (d) { return d.estado === 'STOCK_INSUFICIENTE'; });

        const todoYaImportado = docs.length > 0 && docsYa.length === docs.length;
        if (!todoYaImportado && (docsNuevos.length > 0 || docsSinStock.length > 0 || docsMod.length > 0 || Number(porEstado.PENDIENTE || 0) > 0)) {
          hayAlgoConfirmable = true;
        }

        const cajasPorAlb = resumirCajasPorAlbaranCsv(archivo.texto);
        const cajasDeDoc = function (d) {
          const claveAlb = (String(d.serie || '') + '/' + String(d.numero || '')).toUpperCase();
          return Number((d.resumen && d.resumen.cajasOk) || cajasPorAlb.get(claveAlb) || 0);
        };

        const cajasNuevas = docsNuevos.reduce(function (acc, d) {
          return acc + cajasDeDoc(d);
        }, 0);
        const cajasVentasNuevas = docsNuevos.concat(docsSinStock).reduce(function (acc, d) {
          return acc + cajasDeDoc(d);
        }, 0);

        let signoStr = '';
        let accionStock = '';
        if (diferirComprobacionStock) {
          if (cajasVentasNuevas > 0) {
            signoStr = 'hasta ' + fmt(cajasVentasNuevas);
            accionStock = Math.round(cajasVentasNuevas) === 1 ? 'caja sale' : 'cajas salen';
          } else {
            signoStr = '0';
            accionStock = 'cajas salen';
          }
        } else {
          signoStr = fmtSigned(esCompra ? Math.abs(cajasNuevas) : -Math.abs(cajasNuevas));
          accionStock = esCompra
            ? (Math.round(Math.abs(cajasNuevas)) === 1 ? 'caja entra al stock' : 'cajas entran al stock')
            : (Math.round(Math.abs(cajasNuevas)) === 1 ? 'caja sale del stock' : 'cajas salen del stock');
        }

        const nOk = Number(porEstado.OK || 0);
        const nYa = docsYa.length;
        const nDiferidos = diferirComprobacionStock ? docsSinStock.length : 0;
        const nClienteExcluido = Number(prev.lineasClienteExcluido || porEstado.CLIENTE_EXCLUIDO || 0);
        const nAnteriorCorte = Number(prev.lineasAnterioresCorte || porEstado.ANTERIOR_AL_CORTE || 0);
        const nIgn = Number(porEstado.NO_SEGUIDA || 0) + Number(porEstado.ABONO || 0) + Number(porEstado.SERIE_IGNORADA || 0);
        const nProb = (diferirComprobacionStock ? 0 : docsSinStock.length) + docsMod.length + Number(porEstado.PENDIENTE || 0) + Number(porEstado.ERROR_DATOS || 0);

        const renderDocItems = function (arr) {
          return arr.map(function (d) {
            const cOk = cajasDeDoc(d);
            return '<div class="sl-pend-line-row"><span>' + esc((d.serie || '') + '/' + (d.numero || '')) + ' · ' + esc(fmtFechaDdMm(d.fecha)) + '</span><span class="sl-mono">' + fmt(cOk) + ' cj</span></div>';
          }).join('');
        };

        let filasDetalle = '';
        if (docsNuevos.length > 0) {
          filasDetalle +=
            '<details class="sl-imp-details"><summary>' +
            '<span class="sl-dot-ind" style="background:var(--sl-green)"></span>' +
            '<span style="flex:1"><b>' + esc(pluraliza(docsNuevos.length, 'albarán nuevo', 'albaranes nuevos')) + '</b> · ' + esc(pluraliza(nOk, 'línea lista', 'líneas listas')) + '</span>' +
            '<span class="sl-mono" style="color:var(--sl-text-secondary)">' + fmt(cajasNuevas) + ' cj</span>' +
            '</summary><div class="sl-imp-details-body">' + renderDocItems(docsNuevos) + '</div></details>';
        }
        if (docsYa.length > 0) {
          filasDetalle +=
            '<details class="sl-imp-details"><summary>' +
            '<span class="sl-dot-ind" style="background:var(--sl-text-secondary)"></span>' +
            '<span style="flex:1"><b>' + esc(pluraliza(docsYa.length, 'ya importado', 'ya importados')) + '</b> · ' + (docsYa.length === 1 ? 'se salta' : 'se saltan') + '</span>' +
            '<span class="sl-mono" style="color:var(--sl-text-label)">—</span>' +
            '</summary><div class="sl-imp-details-body">' + renderDocItems(docsYa) + '</div></details>';
        }
        if (docsMod.length > 0) {
          filasDetalle +=
            '<details class="sl-imp-details danger"><summary>' +
            '<span class="sl-dot-ind" style="background:var(--sl-amber)"></span>' +
            '<span style="flex:1"><b>' + esc(pluraliza(docsMod.length, 'modificado en Hispatec', 'modificados en Hispatec')) + '</b> · ' + (docsMod.length === 1 ? 'pasará a Pendientes para revisión' : 'pasarán a Pendientes para revisión') + '</span>' +
            '<span class="sl-mono" style="color:var(--sl-amber)">Revisar</span>' +
            '</summary><div class="sl-imp-details-body">' + renderDocItems(docsMod) + '</div></details>';
        }
        if (docsSinStock.length > 0) {
          if (diferirComprobacionStock) {
            filasDetalle +=
              '<details class="sl-imp-details" open><summary>' +
              '<span class="sl-dot-ind" style="background:var(--sl-text-secondary)"></span>' +
              '<span style="flex:1;color:var(--sl-text-secondary)"><b>Se comprueba al aplicar las compras de esta importación</b> · ' + esc(pluraliza(docsSinStock.length, 'albarán', 'albaranes')) + '</span>' +
              '</summary><div class="sl-imp-details-body">' + renderDocItems(docsSinStock) + '</div></details>';
          } else {
            filasDetalle +=
              '<details class="sl-imp-details danger" open><summary>' +
              '<span class="sl-dot-ind" style="background:var(--sl-red)"></span>' +
              '<span style="flex:1;color:#FCA5A5"><b>' + fmt(docsSinStock.length) + ' sin stock</b> · ' + (docsSinStock.length === 1 ? 'queda pendiente y se aplica solo cuando haya' : 'quedan pendientes y se aplican solos cuando haya') + '</span>' +
              '</summary><div class="sl-imp-details-body">' + renderDocItems(docsSinStock) + '</div></details>';
          }
        }
        if (Number(porEstado.PENDIENTE || 0) > 0) {
          const nPend = Number(porEstado.PENDIENTE || 0);
          filasDetalle +=
            '<details class="sl-imp-details"><summary>' +
            '<span class="sl-dot-ind" style="background:var(--sl-amber)"></span>' +
            '<span style="flex:1"><b>' + esc(pluraliza(nPend, 'línea de artículo sin decidir', 'líneas de artículos sin decidir')) + '</b> · ' + (nPend === 1 ? 'irá a Pendientes' : 'irán a Pendientes') + '</span>' +
            '</summary><div class="sl-imp-details-body">Podrás decidir en Pendientes si seguir o ignorar cada artículo.</div></details>';
        }
        if (nClienteExcluido > 0) {
          filasDetalle +=
            '<details class="sl-imp-details"><summary>' +
            '<span class="sl-dot-ind" style="background:var(--sl-text-secondary)"></span>' +
            '<span style="flex:1;color:var(--sl-text-secondary)"><b>' + esc(pluraliza(nClienteExcluido, 'línea de cliente excluido', 'líneas de clientes excluidos')) + '</b> · ' + (nClienteExcluido === 1 ? 'no cuenta' : 'no cuentan') + '</span>' +
            '<span class="sl-mono" style="color:var(--sl-text-label)">—</span>' +
            '</summary><div class="sl-imp-details-body">Líneas de clientes excluidos del control de stock.</div></details>';
        }
        if (nAnteriorCorte > 0) {
          filasDetalle +=
            '<details class="sl-imp-details"><summary>' +
            '<span class="sl-dot-ind" style="background:var(--sl-text-secondary)"></span>' +
            '<span style="flex:1;color:var(--sl-text-secondary)"><b>' + esc(pluraliza(nAnteriorCorte, 'línea anterior al stock inicial', 'líneas anteriores al stock inicial')) + '</b> · ' + (nAnteriorCorte === 1 ? 'no cuenta' : 'no cuentan') + '</span>' +
            '<span class="sl-mono" style="color:var(--sl-text-label)">—</span>' +
            '</summary><div class="sl-imp-details-body">Líneas con fecha anterior a la fecha de corte; ya están incluidas en el stock inicial.</div></details>';
        }
        if (nIgn > 0) {
          const partesIgn = [];
          if (Number(porEstado.NO_SEGUIDA || 0) > 0) partesIgn.push(pluraliza(porEstado.NO_SEGUIDA, 'no seguida', 'no seguidas'));
          if (Number(porEstado.ABONO || 0) > 0) partesIgn.push(pluraliza(porEstado.ABONO, 'abono', 'abonos'));
          if (Number(porEstado.SERIE_IGNORADA || 0) > 0) partesIgn.push(pluraliza(porEstado.SERIE_IGNORADA, 'serie ignorada', 'series ignoradas'));
          filasDetalle +=
            '<details class="sl-imp-details"><summary>' +
            '<span class="sl-dot-ind" style="background:var(--sl-amber)"></span>' +
            '<span style="flex:1"><b>' + esc(partesIgn.join(' · ')) + '</b> · ' + (nIgn === 1 ? 'no cuenta' : 'no cuentan') + '</span>' +
            '</summary><div class="sl-imp-details-body">Líneas ignoradas según las reglas de series y catálogo.</div></details>';
        }
        if (Number(porEstado.ERROR_DATOS || 0) > 0) {
          filasDetalle +=
            '<details class="sl-imp-details danger"><summary>' +
            '<span class="sl-dot-ind" style="background:var(--sl-red)"></span>' +
            '<span style="flex:1;color:#FCA5A5"><b>' + esc(pluraliza(porEstado.ERROR_DATOS, 'línea con error de datos', 'líneas con error de datos')) + '</b></span>' +
            '</summary><div class="sl-imp-details-body">Revisa que las cajas sean enteros positivos y las fechas válidas.</div></details>';
        }

        const estadoBadge = todoYaImportado
          ? '<span style="font-size:12px;font-weight:600;color:var(--sl-text-secondary)">Ya importado' + (rango ? ' · ' + esc(rango) : '') + '</span>'
          : '<span style="font-size:12px;font-weight:600;color:var(--sl-green)">#' + (idx + 1) + ' · Leído</span>';

        const bannerYa = todoYaImportado
          ? '<div class="sl-imp-summary"><div class="sl-alert-box">Ya importado entero' + (rango ? ' (' + esc(rango) + ')' : '') + '. No se importará otra vez.</div></div>'
          : (
            '<div class="sl-imp-summary">' +
            '<div style="font-size:11px;font-weight:600;letter-spacing:.06em;color:var(--sl-text-label)">QUÉ VA A PASAR</div>' +
            '<div style="display:flex;align-items:baseline;gap:8px;margin-top:6px;flex-wrap:wrap">' +
            '<span class="sl-imp-big-num">' + esc(signoStr) + '</span>' +
            '<span style="font-size:14px;color:var(--sl-text-secondary)">' + esc(accionStock) + '</span>' +
            '</div>' +
            '<div class="sl-imp-segbar" aria-hidden="true">' +
            (nOk > 0 ? '<span style="flex:' + nOk + ';background:var(--sl-green)"></span>' : '') +
            ((nYa + nDiferidos + nClienteExcluido + nAnteriorCorte) > 0 ? '<span style="flex:' + (nYa + nDiferidos + nClienteExcluido + nAnteriorCorte) + ';background:#71717A"></span>' : '') +
            (nIgn > 0 ? '<span style="flex:' + nIgn + ';background:var(--sl-amber)"></span>' : '') +
            (nProb > 0 ? '<span style="flex:' + nProb + ';background:var(--sl-red)"></span>' : '') +
            '</div></div>'
          );

        return (
          '<article class="sl-imp-file-card">' +
          '<div class="sl-imp-file-head">' +
          '<div class="sl-file-icon-box" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg></div>' +
          '<div style="min-width:0;flex:1">' +
          '<div style="font-weight:600;word-break:break-word">' + esc(archivo.nombre) + '</div>' +
          '<div style="font-size:12px;color:var(--sl-text-secondary)">' + esc(tipoLabel) + ' · ' + esc(pluraliza(totalLineas, 'línea', 'líneas')) + (rango ? ' · ' + esc(rango) : '') + ' · ' + esc(archivo.codificacion) + '</div>' +
          '</div>' +
          estadoBadge +
          '</div>' +
          bannerYa +
          filasDetalle +
          '</article>'
        );
      }).join('');

      return { html: html, hayAlgoConfirmable: hayAlgoConfirmable, ordenados: ordenados };
    }

    function renderPrevisualizacionImportacion() {
      const wrap = document.getElementById('impPreviewWrap');
      const list = document.getElementById('impPreviewList');
      const btnConf = document.getElementById('btnConfirmarImportacion');
      if (!wrap || !list) return;

      if (SLImp.archivos.length === 0) {
        setVisibilidad('impPreviewWrap', false);
        list.innerHTML = '';
        return;
      }

      setVisibilidad('impPreviewWrap', true);
      const res = construirHtmlPrevisualizacionImportacion(SLImp.archivos);
      SLImp.archivos = res.ordenados;
      list.innerHTML = res.html;

      if (btnConf) {
        btnConf.disabled = !res.hayAlgoConfirmable || SLImp.confirmando;
      }
    }

    function procesarArchivosCsv(fileList) {
      const files = Array.from(fileList || []);
      if (files.length === 0) return;

      setVisibilidad('impErrorBox', false);
      setVisibilidad('impResultadoWrap', false);

      Promise.all(files.map(function (file) {
        return leerArchivoCsvConCodificacion(file).then(function (dec) {
          return {
            nombre: file.name || 'archivo.csv',
            texto: dec.texto,
            codificacion: dec.codificacion
          };
        });
      }))
      .then(function (leidos) {
        const ordenados = ordenarArchivosImportacion(leidos);
        return Promise.all(ordenados.map(function (item) {
          return window.SLBridge.call('apiPrevisualizarImportacionCsv', item.texto)
            .then(function (preview) {
              return {
                nombre: item.nombre,
                texto: item.texto,
                codificacion: item.codificacion,
                preview: preview,
                error: null
              };
            })
            .catch(function (err) {
              return {
                nombre: item.nombre,
                texto: item.texto,
                codificacion: item.codificacion,
                preview: null,
                error: err && err.message ? err.message : String(err)
              };
            });
        }));
      })
      .then(function (resultados) {
        SLImp.archivos = ordenarArchivosImportacion(resultados);
        renderPrevisualizacionImportacion();
      })
      .catch(function (err) {
        const box = document.getElementById('impErrorBox');
        if (box) {
          box.textContent = err && err.message ? err.message : String(err);
          setVisibilidad('impErrorBox', true);
        }
      });
    }

    function confirmarUnArchivoPorTramos(archivo, onProgreso) {
      const hash = archivo.preview && archivo.preview.hash ? archivo.preview.hash : '';
      let intentos = 0;
      function paso() {
        intentos++;
        return window.SLBridge.call('apiConfirmarImportacionCsv', archivo.texto, hash)
          .then(function (res) {
            if (typeof onProgreso === 'function') onProgreso(res, intentos);
            if (res && res.status === 'EN_CURSO' && intentos < 25) {
              return paso();
            }
            return res;
          });
      }
      return paso();
    }

    function confirmarImportacionTodos() {
      if (SLImp.confirmando || SL.rol === 'CONSULTA') return;
      const pendientesConfirmar = ordenarArchivosImportacion(SLImp.archivos).filter(function (a) {
        if (!a || a.error || !a.preview) return false;
        const docs = Array.isArray(a.preview.documentos) ? a.preview.documentos : [];
        const docsYa = docs.filter(function (d) { return d.estado === 'YA_IMPORTADO'; });
        return !(docs.length > 0 && docsYa.length === docs.length);
      });
      if (pendientesConfirmar.length === 0) return;

      SLImp.confirmando = true;
      setVisibilidad('impErrorBox', false);
      setVisibilidad('impProgressWrap', true);
      setVisibilidad('impResultadoWrap', false);
      const btnConf = document.getElementById('btnConfirmarImportacion');
      if (btnConf) btnConf.disabled = true;

      const onBeforeUnload = function (e) {
        e.preventDefault();
        e.returnValue = 'Hay una importación en curso. ¿Seguro que quieres salir?';
        return e.returnValue;
      };
      window.addEventListener('beforeunload', onBeforeUnload);

      const totalesRes = {
        archivos: 0,
        documentosAplicados: 0,
        cajasEntran: 0,
        cajasSalen: 0,
        ventasSinStock: 0,
        pendientesResueltas: 0,
        yaImportados: 0,
        modificados: 0
      };

      let cadena = Promise.resolve();
      pendientesConfirmar.forEach(function (archivo, idx) {
        cadena = cadena.then(function () {
          const lbl = document.getElementById('impProgressLabel');
          const pct = document.getElementById('impProgressPct');
          const fill = document.getElementById('impProgressFill');
          const progreso = Math.round((idx / pendientesConfirmar.length) * 100);
          if (lbl) lbl.textContent = 'Importando ' + archivo.nombre + ' (' + (idx + 1) + '/' + pendientesConfirmar.length + ')…';
          if (pct) pct.textContent = progreso + '%';
          if (fill) fill.style.width = progreso + '%';

          return confirmarUnArchivoPorTramos(archivo, function (resTramo, nTramo) {
            if (resTramo && resTramo.status === 'EN_CURSO' && lbl) {
              lbl.textContent = 'Importando ' + archivo.nombre + ' · tramo ' + nTramo + '…';
            }
          }).then(function (res) {
            totalesRes.archivos++;
            if (res && res.yaImportado) {
              totalesRes.yaImportados++;
              return;
            }
            const docsRes = Array.isArray(res && res.documentos) ? res.documentos : [];
            const cajasPorAlb = resumirCajasPorAlbaranCsv(archivo.texto);
            docsRes.forEach(function (d) {
              if (d.estado === 'NUEVO' && (d.estadoProceso === 'CONFIRMADO' || d.estadoProceso === 'CONFIRMADO_PARCIAL' || !d.estadoProceso)) {
                totalesRes.documentosAplicados++;
                const claveAlb = (String(d.serie || '') + '/' + String(d.numero || '')).toUpperCase();
                const cj = Number(
                  d.totalCajas ||
                  d.cajasAplicadas ||
                  (d.resumen && d.resumen.cajasOk) ||
                  cajasPorAlb.get(claveAlb) ||
                  0
                );
                if (d.tipoDoc === 'ENTRADA') totalesRes.cajasEntran += cj;
                else totalesRes.cajasSalen += cj;
              } else if (d.estado === 'STOCK_INSUFICIENTE' || d.estadoProceso === 'PENDIENTE_REVISION') {
                totalesRes.ventasSinStock++;
              } else if (d.estado === 'MODIFICADO_EN_ERP') {
                totalesRes.modificados++;
              }
            });
            if (res && res.reintentoPendientes) {
              const ap = Number((res.reintentoPendientes.aplicados && res.reintentoPendientes.aplicados.total) || 0);
              const dc = Number(res.reintentoPendientes.documentosConfirmados || 0);
              totalesRes.pendientesResueltas += Math.max(dc, ap);
            }
          });
        });
      });

      cadena
        .then(function () {
          const fill = document.getElementById('impProgressFill');
          const pct = document.getElementById('impProgressPct');
          if (fill) fill.style.width = '100%';
          if (pct) pct.textContent = '100%';

          const resWrap = document.getElementById('impResultadoWrap');
          if (resWrap) {
            resWrap.innerHTML =
              '<div class="sl-card-flat" style="border-color:rgba(74,222,128,.35)">' +
              '<div style="font-weight:700;font-size:16px;color:var(--sl-green)">Importación completada</div>' +
              '<div class="sl-si-grid" style="margin-top:12px">' +
              '<div class="sl-pend-item"><span style="font-size:12px;color:var(--sl-text-secondary)">Documentos aplicados</span><span class="sl-mono" style="font-size:22px;font-weight:700">' + fmt(totalesRes.documentosAplicados) + '</span></div>' +
              '<div class="sl-pend-item"><span style="font-size:12px;color:var(--sl-text-secondary)">Cajas que entran</span><span class="sl-mono" style="font-size:22px;font-weight:700;color:var(--sl-green)">' + esc(fmtSigned(Math.abs(totalesRes.cajasEntran || 0))) + '</span></div>' +
              '<div class="sl-pend-item"><span style="font-size:12px;color:var(--sl-text-secondary)">Cajas que salen</span><span class="sl-mono" style="font-size:22px;font-weight:700">' + esc(fmtSigned(-Math.abs(totalesRes.cajasSalen || 0))) + '</span></div>' +
              '<div class="sl-pend-item"><span style="font-size:12px;color:var(--sl-text-secondary)">Ventas sin stock</span><span class="sl-mono" style="font-size:22px;font-weight:700;color:' + (totalesRes.ventasSinStock > 0 ? 'var(--sl-red)' : 'var(--sl-text-secondary)') + '">' + fmt(totalesRes.ventasSinStock) + '</span></div>' +
              '</div>' +
              (totalesRes.pendientesResueltas > 0
                ? '<div class="sl-alert-box ok" style="margin-top:12px"><b>Pendientes resueltas solas:</b> ' + esc(pluraliza(totalesRes.pendientesResueltas, 'pendiente se ha aplicado automáticamente', 'pendientes se han aplicado automáticamente')) + ' al entrar el stock.</div>'
                : '') +
              '<div style="display:flex;gap:10px;margin-top:14px;flex-wrap:wrap">' +
              '<button type="button" id="btnImpIrExistencias" class="sl-btn">Ver existencias</button>' +
              '<button type="button" id="btnImpIrPendientes" class="sl-ghost">Ver pendientes</button>' +
              '</div></div>';
            setVisibilidad('impResultadoWrap', true);
            const bEx = document.getElementById('btnImpIrExistencias');
            const bPe = document.getElementById('btnImpIrPendientes');
            if (bEx) bEx.addEventListener('click', volverAExistencias);
            if (bPe) bPe.addEventListener('click', abrirPendientes);
          }

          SLImp.archivos = [];
          renderPrevisualizacionImportacion();
          cargarInicio({ silencioso: true });
        })
        .catch(function (err) {
          const box = document.getElementById('impErrorBox');
          if (box) {
            box.textContent = err && err.message ? err.message : String(err);
            setVisibilidad('impErrorBox', true);
          }
        })
        .finally(function () {
          SLImp.confirmando = false;
          window.removeEventListener('beforeunload', onBeforeUnload);
          setVisibilidad('impProgressWrap', false);
          if (btnConf) btnConf.disabled = false;
        });
    }

    // --- Stock inicial (ADMIN) ---

    function hayMovimientosExistentes() {
      if (!SL.inicio) return false;
      if (Number(SL.inicio.total || 0) > 0) return true;
      if (Array.isArray(SL.inicio.ultimos) && SL.inicio.ultimos.length > 0) return true;
      return false;
    }

    function renderPrevisualizacionStockInicial(prev) {
      const wrap = document.getElementById('siPreviewWrap');
      const body = document.getElementById('siPreviewBody');
      const btnConf = document.getElementById('btnSiConfirmar');
      const anadirWrap = document.getElementById('siAnadirWrap');
      if (!wrap || !body) return;

      if (!prev || prev.status !== 'OK') {
        setVisibilidad('siPreviewWrap', false);
        const errBox = document.getElementById('siErrorBox');
        if (errBox) {
          errBox.textContent = (prev && prev.error) || 'No se pudo previsualizar el CSV de stock inicial.';
          setVisibilidad('siErrorBox', true);
        }
        return;
      }

      setVisibilidad('siErrorBox', false);
      setVisibilidad('siPreviewWrap', true);

      const filas = Array.isArray(prev.filas) ? prev.filas : [];
      const tot = prev.totales || {};
      const gen = tot.general || { cajas: 0, filas: 0 };
      const porArt = Array.isArray(tot.porArticuloEnvase) ? tot.porArticuloEnvase : [];
      const porProv = Array.isArray(tot.porProveedor) ? tot.porProveedor : [];

      const conteoEstados = { OK: 0, NO_SEGUIDA: 0, DESCONOCIDA: 0, ERROR_DATOS: 0 };
      filas.forEach(function (f) {
        conteoEstados[f.estado] = (conteoEstados[f.estado] || 0) + 1;
      });

      const artRows = porArt.map(function (r) {
        return '<tr><td>' + esc(nombreLegible(r.articulo)) + ' · ' + esc(nombreLegible(r.envase)) + '</td><td class="num">' + fmt(r.cajas) + '</td></tr>';
      }).join('');
      const provRows = porProv.map(function (r) {
        return '<tr><td>' + esc(nombreLegible(r.proveedor)) + '</td><td class="num">' + fmt(r.cajas) + '</td></tr>';
      }).join('');
      const filasRows = filas.map(function (f) {
        const col = f.estado === 'OK' ? 'var(--sl-green)' : (f.estado === 'NO_SEGUIDA' ? 'var(--sl-text-secondary)' : 'var(--sl-red)');
        return (
          '<tr>' +
          '<td class="num">' + esc(f.linea || '') + '</td>' +
          '<td>' + esc(fmtFechaDdMm(f.fecha)) + '</td>' +
          '<td>' + esc(nombreLegible(f.articulo)) + ' · ' + esc(nombreLegible(f.envase)) + '</td>' +
          '<td class="num">' + fmt(f.cajas) + '</td>' +
          '<td style="color:' + col + ';font-weight:600">' + esc(f.estado) + (f.motivo ? ' (' + esc(f.motivo) + ')' : '') + (f.aviso ? ' · ' + esc(f.aviso) : '') + '</td>' +
          '</tr>'
        );
      }).join('');

      body.innerHTML =
        '<div class="sl-card-flat">' +
        '<div style="display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:10px">' +
        '<div><div style="font-size:12px;color:var(--sl-text-secondary)">Total general a cargar</div>' +
        '<div class="sl-imp-big-num">' + fmt(gen.cajas) + ' <span style="font-size:15px;font-weight:400;color:var(--sl-text-secondary)">' + (Math.round(Number(gen.cajas) || 0) === 1 ? 'caja' : 'cajas') + ' · ' + esc(pluraliza(gen.filas, 'fila OK', 'filas OK')) + '</span></div></div>' +

    function renderPendientes(data) {
      SLImp.pendientesData = data || { totalDocumentos: 0, totalFilas: 0, porMotivo: {} };
      const porMotivo = SLImp.pendientesData.porMotivo || {};
      const bloqueStock = porMotivo.STOCK_INSUFICIENTE || { totalDocumentos: 0, documentos: [] };
      const bloqueSeg = porMotivo.SEGUIMIENTO_DESCONOCIDO || { totalDocumentos: 0, documentos: [] };
      const bloqueMod = porMotivo.MODIFICADO_EN_ERP || { totalDocumentos: 0, documentos: [] };

      const gruposSeg = agruparSeguimientoDesconocido(bloqueSeg);
      const totalDocs = Number(SLImp.pendientesData.totalDocumentos || 0);
      actualizarBadgesPendientes(totalDocs);

      const cStock = document.getElementById('pendCountStock');
      const cSeg = document.getElementById('pendCountSeguimiento');
      const cMod = document.getElementById('pendCountModificados');
      if (cStock) cStock.textContent = String(bloqueStock.totalDocumentos || 0);
      if (cSeg) cSeg.textContent = String(gruposSeg.length);
      if (cMod) cMod.textContent = String(bloqueMod.totalDocumentos || 0);

      // 1. Ventas sin stock
      const listaStock = document.getElementById('pendListaStock');
      if (listaStock) {
        const docs = Array.isArray(bloqueStock.documentos) ? bloqueStock.documentos : [];
        if (docs.length === 0) {
          listaStock.innerHTML = '<div style="font-size:13px;color:var(--sl-text-secondary)">No hay ventas esperando stock.</div>';
        } else {
          listaStock.innerHTML = docs.map(function (doc) {
            const alb = [doc.serie, doc.numero].filter(Boolean).join('/');
            const lineasHtml = (doc.lineas || []).map(function (l) {
              return (
                '<div class="sl-pend-line-row">' +
                '<span>' + esc(nombreLegible(l.articulo)) + ' · ' + esc(nombreLegible(l.envase)) + '</span>' +
                '<span class="sl-mono" style="color:var(--sl-red)">' + fmt(l.cajas) + ' cj</span>' +
                '</div>'
              );
            }).join('');
            return (
              '<div class="sl-pend-item">' +
              '<div class="sl-pend-item-head">' +
              '<span><b>' + esc(alb || 'Albarán') + '</b> · ' + esc(fmtFechaDdMm(doc.fecha_negocio)) + (doc.entidad ? ' · ' + esc(nombreLegible(doc.entidad)) : '') + '</span>' +
              '<span class="sl-mono" style="font-weight:600">' + fmt(doc.totalCajas) + ' cj</span>' +
              '</div>' +
              '<div class="sl-pend-lines">' + lineasHtml + '</div>' +
              '</div>'
            );
          }).join('');
        }
      }

      // 2. Artículos nuevos sin decidir
      const listaSeg = document.getElementById('pendListaSeguimiento');
      if (listaSeg) {
        if (gruposSeg.length === 0) {
          listaSeg.innerHTML = '<div style="font-size:13px;color:var(--sl-text-secondary)">No hay artículos nuevos sin decidir.</div>';
        } else {
          listaSeg.innerHTML = gruposSeg.map(function (g) {
            const confirmandoEsta = SLImp.confirmarDecisionClave && SLImp.confirmarDecisionClave.clave === g.clave;
            let accionesHtml = '';
            if (confirmandoEsta && SLImp.confirmarDecisionClave.decision === 'SEGUIR') {
              const gruposOpts = (SLImp.gruposComerciales || []).map(function (grp) {
                return '<option value="' + esc(grp) + '">' + esc(nombreLegible(grp)) + '</option>';
              }).join('');
              accionesHtml =
                '<div class="sl-seguir-dialog" id="pendDialogoSeguir" data-solo-escritura="1">' +
                '<div style="font-size:13px;font-weight:600">¿En qué variedad va ' + esc(nombreLegible(g.articulo)) + '?</div>' +
                '<div class="sl-pend-actions">' +
                '<select id="selGrupoSeguir" class="sl-select-inline" aria-label="Variedad destino">' +
                gruposOpts +
                '<option value="">Sin agrupar</option>' +
                '</select>' +
                '<button type="button" class="sl-btn" data-confirmar-decision="SEGUIR" data-art="' + esc(g.articulo) + '" data-env="' + esc(g.envase) + '" data-solo-escritura="1">Sí, seguir</button>' +
                '<button type="button" class="sl-ghost" data-cancelar-decision="1" data-solo-escritura="1">Cancelar</button>' +
                '</div></div>';
            } else if (confirmandoEsta) {
              accionesHtml =
                '<div class="sl-pend-actions" data-solo-escritura="1">' +
                '<span style="font-size:13px;color:var(--sl-amber)">¿Confirmar <b>ignorarlo</b>?</span>' +
                '<button type="button" class="sl-btn" data-confirmar-decision="IGNORAR" data-art="' + esc(g.articulo) + '" data-env="' + esc(g.envase) + '" data-solo-escritura="1">Sí, confirmar</button>' +
                '<button type="button" class="sl-ghost" data-cancelar-decision="1" data-solo-escritura="1">Cancelar</button>' +
                '</div>';
            } else {
              accionesHtml =
                '<div class="sl-pend-actions" data-solo-escritura="1">' +
                '<button type="button" class="sl-btn" data-pedir-decision="SEGUIR" data-clave="' + esc(g.clave) + '" data-solo-escritura="1">Seguir este artículo</button>' +
                '<button type="button" class="sl-ghost" data-pedir-decision="IGNORAR" data-clave="' + esc(g.clave) + '" data-solo-escritura="1">Ignorarlo</button>' +
                '</div>';

            return (
              '<div class="sl-pend-item">' +

              '<span class="sl-mono">' + fmt(g.cajas) + ' cj</span>' +
              '</div>' +
              '<div style="font-size:12px;color:var(--sl-text-secondary)">' + esc(pluraliza(g.lineas, 'línea esperando', 'líneas esperando')) + ' · ' + (g.documentos.length === 1 ? 'Albarán: ' : 'Albaranes: ') + esc(g.documentos.join(', ')) + '</div>' +

          listaSeg.querySelectorAll('[data-pedir-decision]').forEach(function (btn) {

            });
          });
          listaSeg.querySelectorAll('[data-cancelar-decision]').forEach(function (btn) {
            btn.addEventListener('click', function () {
              SLImp.confirmarDecisionClave = null;
              renderPendientes(SLImp.pendientesData);

          });
          listaSeg.querySelectorAll('[data-confirmar-decision]').forEach(function (btn) {
            btn.addEventListener('click', function () {
              const dec = btn.getAttribute('data-confirmar-decision');
              const art = btn.getAttribute('data-art');
              const env = btn.getAttribute('data-env');
              const sel = document.getElementById('selGrupoSeguir');

      const listaMod = document.getElementById('pendListaModificados');
      if (listaMod) {

        if (docs.length === 0) {

        } else {
          listaMod.innerHTML = docs.map(function (doc) {
            const alb = [doc.serie, doc.numero].filter(Boolean).join('/');

              '<span class="sl-mono" style="color:var(--sl-amber)">Diferencia: ' + esc(fmtSigned(doc.totalCajas)) + ' cj</span>' +

              '<div class="sl-pend-actions" data-solo-escritura="1">' +

              '<button type="button" class="sl-btn" data-aplicar-version="' + esc(idPend) + '" data-solo-escritura="1">Aplicar la versión nueva</button>' +
              '</div>' +
              '</div>'
            );
          }).join('');

          listaMod.querySelectorAll('[data-marcar-revisado]').forEach(function (btn) {
            btn.addEventListener('click', function () {
              const idPend = btn.getAttribute('data-marcar-revisado');
              const inp = listaMod.querySelector('[data-nota-pend="' + idPend + '"]');
              const nota = inp ? String(inp.value || '').trim() : '';
              marcarPendienteRevisado(idPend, nota);

        }
      }

      aplicarRol(SL.rol);
    }

    function extraerGruposComerciales(config) {
      const filas = (config && Array.isArray(config.agrupaciones)) ? config.agrupaciones : [];
      const activas = filas
        .filter(function (f) {
          if (!f) return false;
          const act = f.activo !== undefined ? f.activo : f.activa;
          if (act === false) return false;
          const s = String(act === undefined || act === null ? 'TRUE' : act).trim().toUpperCase();
          return s !== 'FALSE' && s !== 'NO' && s !== '0';
        })
        .filter(function (f) {
          return String(f.agrupacion || '').trim().toUpperCase() === 'COMERCIAL';
        })
        .sort(function (a, b) {
          const oa = Number.isFinite(Number(a.orden)) ? Number(a.orden) : Number.MAX_SAFE_INTEGER;
          const ob = Number.isFinite(Number(b.orden)) ? Number(b.orden) : Number.MAX_SAFE_INTEGER;
          return oa - ob;
        });

      const vistos = new Set();
      const grupos = [];
      activas.forEach(function (f) {
        const g = String(f.grupo || '').trim();
        const k = g.toUpperCase();
        if (!g || k === 'SIN CLASIFICAR' || k === 'SIN AGRUPAR' || vistos.has(k)) return;
        vistos.add(k);
        grupos.push(g);
      });
      return grupos;
    }

    function cargarPendientes() {
      setVisibilidad('pendErrorBox', false);
      setVisibilidad('pendCargando', true);
      if (!window.SLBridge || typeof window.SLBridge.call !== 'function') {
        setVisibilidad('pendCargando', false);
        return Promise.resolve();
      }
      const pGrupos = SLImp.gruposComerciales.length > 0
        ? Promise.resolve(SLImp.gruposComerciales)
        : window.SLBridge.call('apiGetConfiguracionCatalogo')
          .then(function (cfg) {
            SLImp.gruposComerciales = extraerGruposComerciales(cfg);
            return SLImp.gruposComerciales;
          })
          .catch(function () {
            if (SL.inicio && Array.isArray(SL.inicio.variedades)) {
              SLImp.gruposComerciales = SL.inicio.variedades
                .map(function (v) { return v.grupo; })
                .filter(function (g) { return g && g.toUpperCase() !== 'SIN AGRUPAR'; });
            }
            return SLImp.gruposComerciales;
          });

      return Promise.all([
        window.SLBridge.call('apiListarPendientes', { estado: 'PENDIENTE' }),
        pGrupos
      ])
        .then(function (resArr) {
          setVisibilidad('pendCargando', false);
          renderPendientes(resArr[0]);
        })
        .catch(function (err) {
          setVisibilidad('pendCargando', false);
          const box = document.getElementById('pendErrorBox');
          if (box) {
            box.textContent = err && err.message ? err.message : String(err);
            setVisibilidad('pendErrorBox', true);
          }
        });
    }

    function fmtFechaDdMm(iso) {
      const s = String(iso || '').trim();
      const m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
      if (!m) return s || '—';
      return m[3] + '/' + m[2];
    }

    function fmtHora(dateObj) {
      if (!dateObj) return '—';
      const hh = String(dateObj.getHours()).padStart(2, '0');
      const mm = String(dateObj.getMinutes()).padStart(2, '0');
      return hh + ':' + mm;
    }

    function esc(text) {
      if (text === null || text === undefined) return '';
      return String(text)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function hexAlpha(hex, alpha) {
      const clean = String(hex || '#4FA37C').trim();
      if (/^#[0-9a-fA-F]{6}$/.test(clean)) {
        const aHex = Math.round(Math.max(0, Math.min(1, alpha)) * 255).toString(16).padStart(2, '0');
        return clean + aHex;
      }
      return clean;
    }

    function opacidadPartida(idx, total) {
      if (total <= 1) return 1;
      return 1 - (idx / (total - 1)) * 0.55;
    }

    function mostrarAviso(msg, tipo) {
      const cont = document.getElementById('toastContainer');
      if (!cont) return;
      cont.innerHTML = '';
      const el = document.createElement('div');
      el.className = 'sl-toast' + (tipo ? ' ' + tipo : '');
      el.textContent = msg;
      cont.appendChild(el);
      clearTimeout(SL.toastTimer);
      SL.toastTimer = setTimeout(function () {
        el.remove();
      }, 3200);
    }
