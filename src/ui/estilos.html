<style>
  :root {
    --sl-bg: #0A0A0B;
    --sl-panel: #121214;
    --sl-elevated: #18181B;
    --sl-hover: #141417;
    --sl-line: #1F1F23;
    --sl-line-subtle: #1C1C20;
    --sl-line-strong: #27272A;
    --sl-text: #EDEDEF;
    --sl-text-secondary: #8A8F98;
    --sl-text-label: #80858E;
    --sl-btn-bg: #EDEDEF;
    --sl-btn-text: #0A0A0B;
    --sl-green: #4ADE80;
    --sl-amber: #FBBF24;
    --sl-red: #F87171;
    --sl-out: #8B8B94;
    --sl-brand: #F2553D;
    --sl-pink: #F59ABF;
    --sl-font: 'Geist', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    --sl-mono: 'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    --sl-radius-sm: 6px;
    --sl-radius-md: 8px;
    --sl-radius-lg: 12px;
    --sl-radius-xl: 16px;
  }

  *, *::before, *::after {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--sl-bg);
    color: var(--sl-text);
    font-family: var(--sl-font);
    font-size: 15px;
    line-height: 1.4;
    -webkit-font-smoothing: antialiased;
    overflow-x: clip;
  }

  @media (min-width: 1024px) {
    html, body {
      font-size: 14px;
    }
  }

  a { color: inherit; text-decoration: none; }
  button { font-family: inherit; }

  /* Animaciones cerradas (DISENO.md v3) */
  @keyframes sl-draw { from { stroke-dashoffset: 1400; } to { stroke-dashoffset: 0; } }
  @keyframes sl-fill { from { opacity: 0; } to { opacity: 1; } }
  @keyframes sl-rise { from { transform: scaleY(0); } to { transform: scaleY(1); } }
  @keyframes sl-grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  @keyframes sl-up { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @keyframes sl-drawer { from { transform: translateX(24px); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes sl-sheet { from { transform: translateY(100%); } to { transform: none; } }
  @keyframes sl-dot { 0% { transform: scale(.4); } 60% { transform: scale(1.25); } 100% { transform: scale(1); } }
  @keyframes sl-float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
  @keyframes sl-shimmer { 0% { background-position: -280px 0; } 100% { background-position: 280px 0; } }
  @keyframes sl-spin { to { transform: rotate(360deg); } }

  .sl-draw { stroke-dasharray: 1400; animation: sl-draw 1.4s cubic-bezier(.3, .7, .2, 1) both; }
  .sl-fill { animation: sl-fill .8s .6s ease both; }
  .sl-rise { transform-origin: bottom center; animation: sl-rise .7s cubic-bezier(.2, .8, .2, 1) both; }
  .sl-drop { transform-origin: top center; animation: sl-rise .7s cubic-bezier(.2, .8, .2, 1) both; }
  .sl-grow { transform-origin: left center; animation: sl-grow .75s cubic-bezier(.2, .8, .2, 1) both; }
  .sl-up { animation: sl-up .45s cubic-bezier(.2, .8, .2, 1) both; }
  .sl-drawer { animation: sl-drawer .3s cubic-bezier(.2, .8, .2, 1) both; }
  .sl-sheet { animation: sl-sheet .38s cubic-bezier(.2, .9, .2, 1) both; }
  .sl-dot { animation: sl-dot .25s cubic-bezier(.2, .8, .2, 1) both; }
  .sl-float { animation: sl-float 4s ease-in-out infinite; }
  .sl-spin { animation: sl-spin 1s linear infinite; }
  .sl-sk {
    background-color: #18181B;
    background-image: linear-gradient(90deg, #18181B 0%, var(--sl-line-strong) 50%, #18181B 100%);
    background-size: 560px 100%;
    animation: sl-shimmer 1.4s linear infinite;
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation: none !important;
      transition: none !important;
    }
    .sl-sk {
      background-image: none !important;
    }
  }

  /* Pantalla de entrada / PIN (08) */
  .pantalla-entrada {
    min-height: 100vh;
    width: 100%;
    background: var(--sl-bg);
    color: var(--sl-text);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 48px 24px 36px;
  }

  .entrada-card {
    width: 100%;
    max-width: 340px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }

  .entrada-logo {
    width: 64px;
    height: 64px;
    border-radius: 14px;
    background: var(--sl-brand);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .entrada-marca {
    margin: 22px 0 0;
    font-size: 28px;
    font-weight: 700;
    letter-spacing: -.02em;
    color: var(--sl-text);
  }

  .entrada-texto {
    margin: 6px 0 0;
    font-size: 14px;
    color: var(--sl-text-secondary);
    line-height: 1.45;
  }

  .entrada-pin {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
    margin-top: 32px;
    min-height: 20px;
  }

  .entrada-pin-dot {
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: transparent;
    border: 2px solid rgba(255, 255, 255, .25);
    display: inline-block;
  }

  .entrada-pin-dot.filled {
    background: var(--sl-text);
    border-color: var(--sl-text);
  }

  .entrada-pin-dot.ok {
    background: var(--sl-green);
    border-color: var(--sl-green);
  }

  .entrada-teclado {
    display: grid;
    grid-template-columns: repeat(3, 76px);
    gap: 14px 22px;
    margin-top: 32px;
    justify-content: center;
  }

  .entrada-tecla {
    width: 76px;
    height: 76px;
    min-height: 56px;
    border-radius: 50%;
    border: 1px solid var(--sl-line-strong);
    background: rgba(255, 255, 255, .04);
    color: var(--sl-text);
    font: 600 28px var(--sl-font);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: transform .1s ease, background .15s ease;
    -webkit-tap-highlight-color: transparent;
  }

  .entrada-tecla:hover { background: var(--sl-line); }
  .entrada-tecla:active { transform: scale(.92); background: var(--sl-line-strong); }

  .entrada-tecla.accion {
    background: transparent;
    border-color: transparent;
    color: var(--sl-text);
  }

  .entrada-tecla.espacio {
    visibility: hidden;
    pointer-events: none;
  }

  .entrada-confirmar {
    margin-top: 20px;
    height: 46px;
    padding: 0 28px;
    border-radius: 999px;
    border: 0;
    background: var(--sl-btn-bg);
    color: var(--sl-btn-text);
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
    transition: opacity .15s ease, background .12s ease;
  }

  .entrada-confirmar:disabled {
    opacity: .3;
    cursor: default;
  }

  .entrada-error {
    margin: 14px 0 0;
    min-height: 18px;
    font-size: 13px;
    color: var(--sl-red);
  }

  .entrada-enlace {
    margin-top: 6px;
    border: 0;
    background: transparent;
    color: var(--sl-text-secondary);
    font-size: 13px;
    cursor: pointer;
    text-decoration: underline;
    padding: 6px 10px;
  }

  .entrada-pie {
    margin-top: 22px;
    font-size: 12px;
    color: var(--sl-text-label);
    line-height: 1.45;
  }

  .entrada-oculta {
    display: none !important;
  }

  /* Shell de la app */
  .sl-app {
    min-height: 100vh;
    width: 100%;
    display: flex;
    background: var(--sl-bg);
    color: var(--sl-text);
    position: relative;
  }

  .sl-sidebar {
    display: none;
  }

  .sl-main-wrap {
    flex: 1 1 auto;
    min-width: 0;
    width: 100%;
    display: flex;
    flex-direction: column;
  }

  /* Topbar móvil (<1024px) */
  .sl-mobile-topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 18px 0;
    max-width: 720px;
    width: 100%;
    margin: 0 auto;
  }

  .sl-brand-inline {
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 600;
    font-size: 15px;
    color: var(--sl-text);
  }

  .sl-user-actions {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .sl-avatar {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: var(--sl-elevated);
    border: 1px solid var(--sl-line-strong);
    color: var(--sl-text);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 600;
    flex: none;
  }

  .sl-btn-salir-pill {
    height: 32px;
    padding: 0 11px;
    border-radius: 999px;
    border: 1px solid var(--sl-line-strong);
    background: transparent;
    color: var(--sl-text-secondary);
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
  }

  .sl-btn-salir-pill:hover {
    background: var(--sl-elevated);
    color: var(--sl-text);
  }

  .sl-desktop-only { display: none; }
  .sl-mobile-only { display: block; }

  @media (min-width: 1024px) {
    .sl-sidebar {
      width: 220px;
      flex: none;
      border-right: 1px solid var(--sl-line-subtle);
      padding: 16px 12px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      color: var(--sl-text-secondary);
      position: sticky;
      top: 0;
      height: 100vh;
      align-self: flex-start;
      overflow-y: auto;
    }

    .sl-mobile-topbar { display: none; }
    .sl-desktop-only { display: block; }
    .sl-mobile-only { display: none; }
  }

  .sl-nav-list {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .sl-nav {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 10px;
    border-radius: var(--sl-radius-sm);
    border: 0;
    background: transparent;
    color: var(--sl-text-secondary);
    font-size: 14px;
    font-weight: 400;
    cursor: pointer;
    width: 100%;
    text-align: left;
    transition: background .12s ease, color .12s ease;
  }

  .sl-nav:hover {
    background: var(--sl-hover);
    color: var(--sl-text);
  }

  .sl-nav[aria-current="page"] {
    background: var(--sl-elevated);
    color: var(--sl-text);
    font-weight: 500;
  }

  .sl-nav-badge {
    margin-left: auto;
    font-family: var(--sl-mono);
    font-size: 12px;
    color: var(--sl-text);
    background: var(--sl-line-strong);
    border-radius: 4px;
    padding: 0 5px;
    line-height: 1.5;
  }

  .sl-sidebar-footer {
    margin-top: auto;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px;
  }

  .sl-sidebar-footer .sl-avatar {
    width: 26px;
    height: 26px;
    font-size: 12px;
  }

  .sl-user-name {
    font-size: 13px;
    color: var(--sl-text);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    flex: 1 1 auto;
    min-width: 0;
  }

  /* Contenedores de contenido */
  .sl-desktop-container {
    max-width: 1120px;
    margin: 0 auto;
    padding: 28px clamp(16px, 3vw, 40px) 48px;
    display: flex;
    flex-direction: column;
    gap: 28px;
  }

  .sl-mobile-container {
    max-width: 720px;
    margin: 0 auto;
    padding: 0 0 36px;
  }

  /* Botones estándar */
  .sl-btn {
    height: 36px;
    padding: 0 14px;
    border-radius: var(--sl-radius-md);
    border: 0;
    background: var(--sl-btn-bg);
    color: var(--sl-btn-text);
    font-weight: 600;
    font-size: 13px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    cursor: pointer;
    transition: background .12s ease;
  }
  .sl-btn:hover { background: #E4E4E7; }

  .sl-ghost {
    height: 36px;
    padding: 0 14px;
    border-radius: var(--sl-radius-md);
    border: 1px solid var(--sl-line-strong);
    background: transparent;
    color: var(--sl-text);
    font-weight: 500;
    font-size: 13px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    cursor: pointer;
    transition: background .12s ease;
  }
  .sl-ghost:hover { background: var(--sl-elevated); }

  /* Selector de periodo */
  .sl-seg {
    display: flex;
    border: 1px solid var(--sl-line-strong);
    border-radius: var(--sl-radius-md);
    overflow: hidden;
  }
  .sl-seg button {
    height: 34px;
    padding: 0 12px;
    border: 0;
    background: transparent;
    color: var(--sl-text-secondary);
    font: 500 13px var(--sl-font);
    cursor: pointer;
  }
  .sl-seg button[aria-pressed="true"] {
    background: var(--sl-elevated);
    color: var(--sl-text);
  }

  /* Hero cifra protagonista */
  .sl-hero-num {
    font-size: 56px;
    font-weight: 600;
    letter-spacing: -.035em;
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .sl-mobile-hero-num {
    font-size: 54px;
    font-weight: 600;
    letter-spacing: -.04em;
    line-height: 1.05;
    font-variant-numeric: tabular-nums;
  }

  /* Franja indicadores ordenador */
  .sl-kpi-strip {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    border: 1px solid var(--sl-line-subtle);
    border-radius: 10px;
    background: var(--sl-bg);
  }
  .sl-kpi-cell {
    padding: 14px 16px;
    border-right: 1px solid var(--sl-line-subtle);
    min-width: 0;
  }
  .sl-kpi-cell:last-child { border-right: 0; }
  .sl-kpi-label { color: var(--sl-text-secondary); font-size: 12px; }
  .sl-kpi-val { font-size: 20px; font-weight: 600; margin-top: 4px; font-variant-numeric: tabular-nums; }
  .sl-kpi-sub { font-size: 13px; font-weight: 500; }

  /* Tabla variedades ordenador */
  .sl-var-header-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 10px;
  }

  .sl-chip {
    height: 28px;
    padding: 0 10px;
    border-radius: var(--sl-radius-sm);
    border: 1px solid var(--sl-line-strong);
    background: transparent;
    color: var(--sl-text-secondary);
    font-size: 12px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
  }
  .sl-chip[aria-pressed="true"] {
    background: var(--sl-elevated);
    color: var(--sl-text);
  }

  .sl-search-input {
    height: 28px;
    padding: 0 10px;
    border-radius: var(--sl-radius-sm);
    border: 1px solid var(--sl-line-strong);
    background: var(--sl-panel);
    color: var(--sl-text);
    font-family: var(--sl-font);
    font-size: 12px;
    outline: none;
    width: 170px;
  }

  .sl-table-box {
    border: 1px solid var(--sl-line-subtle);
    border-radius: 10px;
    overflow-x: auto;
  }

  .sl-table-inner {
    min-width: 680px;
  }

  .sl-table-head {
    display: grid;
    grid-template-columns: minmax(170px, 1.5fr) 74px minmax(130px, 2fr) 105px 96px;
    gap: 12px;
    padding: 10px 16px;
    font-size: 12px;
    color: var(--sl-text-label);
    border-bottom: 1px solid var(--sl-line-subtle);
  }

  .sl-row {
    display: grid;
    grid-template-columns: minmax(170px, 1.5fr) 74px minmax(130px, 2fr) 105px 96px;
    gap: 12px;
    padding: 12px 16px;
    align-items: center;
    border-bottom: 1px solid var(--sl-line-subtle);
    cursor: pointer;
    transition: background .12s ease;
    width: 100%;
    border-left: 0;
    border-right: 0;
    border-top: 0;
    background: transparent;
    color: var(--sl-text);
    text-align: left;
  }
  .sl-row:last-child { border-bottom: 0; }
  .sl-row:hover { background: var(--sl-hover); }
  .sl-row.selected { background: var(--sl-hover); }

  /* Móvil tarjetas y botones redondos (04) */
  .sl-mobile-actions {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 4px;
    padding: 14px 18px 0;
  }
  .sl-round-action {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--sl-text);
    background: transparent;
    border: 0;
    cursor: pointer;
    padding: 4px 0;
  }
  .sl-round-icon {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: var(--sl-elevated);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .sl-card {
    margin: 16px 14px 0;
    background: var(--sl-panel);
    border: 1px solid var(--sl-line);
    border-radius: var(--sl-radius-xl);
    overflow: hidden;
  }

  .sl-mobile-var-row {
    width: 100%;
    display: grid;
    grid-template-columns: 36px minmax(0, 1fr) auto;
    gap: 12px;
    align-items: center;
    padding: 11px 16px;
    border: 0;
    background: transparent;
    color: var(--sl-text);
    text-align: left;
    cursor: pointer;
    transition: background .1s ease;
  }
  .sl-mobile-var-row:active { background: var(--sl-hover); }

  /* Buscador móvil arriba de Variedades */
  .sl-mobile-search-wrap {
    padding: 14px 14px 0;
    position: relative;
  }
  .sl-mobile-search-box {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--sl-panel);
    border: 1px solid var(--sl-line);
    border-radius: 12px;
    padding: 0 12px;
    height: 44px;
  }
  .sl-mobile-search-box:focus-within {
    border-color: var(--sl-line-strong);
  }
  .sl-mobile-search-input {
    flex: 1 1 auto;
    min-width: 0;
    height: 100%;
    border: 0;
    background: transparent;
    color: var(--sl-text);
    font-family: var(--sl-font);
    font-size: 14px;
    outline: none;
  }
  .sl-mobile-search-input::placeholder {
    color: var(--sl-text-label);
  }

  /* Desglose por artículo + envase y botones Compartir / Copiar */
  .sl-share-row {
    display: flex;
    gap: 8px;
    margin-top: 10px;
  }
  .sl-desglose-wrap {
    padding: 0 18px 12px;
  }
  .sl-desglose-wrap.mobile {
    padding: 12px 0 6px;
  }
  .sl-desglose-list {
    display: flex;
    flex-direction: column;
    gap: 4px;
    margin-top: 6px;
  }
  .sl-desglose-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    padding: 7px 10px;
    border-radius: var(--sl-radius-md);
    background: var(--sl-elevated);
    font-size: 13px;
  }
  .sl-desglose-bloque {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .sl-desglose-subtotal {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    padding: 7px 10px 2px;
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--sl-text-label);
  }
  .sl-desglose-subtotal > span:first-child {
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .sl-desglose-subtotal .sl-mono {
    font-family: var(--sl-mono);
    color: var(--sl-text-secondary);
    flex: none;
    text-transform: none;
    letter-spacing: 0;
  }

  /* Rol CONSULTA: oculta botones de acción */
  body.sl-rol-consulta [data-solo-escritura="1"] {
    display: none !important;
  }
  body.sl-rol-consulta .sl-mobile-actions {
    display: flex;
    justify-content: center;
  }
  .sl-consulta-only {
    display: none !important;
  }
  body.sl-rol-consulta .sl-consulta-only {
    display: flex !important;
  }
  body:not(.sl-rol-admin) [data-solo-admin="1"] {
    display: none !important;
  }

  /* Pantallas secundarias: Importar y Pendientes (T-028) */
  .sl-page-wrap {
    max-width: 1040px;
    width: 100%;
    margin: 0 auto;
    padding: 20px 16px 64px;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }
  @media (min-width: 1024px) {
    .sl-page-wrap {
      padding: 28px clamp(16px, 3vw, 40px) 64px;
    }
  }
  .sl-page-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 14px;
  }
  .sl-icon-btn {
    width: 44px;
    height: 44px;
    border-radius: 12px;
    background: var(--sl-panel);
    border: 1px solid var(--sl-line);
    color: var(--sl-text);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex: none;
  }
  .sl-icon-btn:hover { background: var(--sl-elevated); }
  .sl-page-title {
    margin: 0;
    font-size: 20px;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .sl-page-sub {
    margin: 2px 0 0;
    font-size: 13px;
    color: var(--sl-text-secondary);
  }
  .sl-tabs {
    display: flex;
    gap: 4px;
    background: var(--sl-panel);
    border: 1px solid var(--sl-line);
    border-radius: 10px;
    padding: 4px;
    flex-wrap: wrap;
  }
  .sl-tab {
    height: 34px;
    padding: 0 12px;
    border-radius: 7px;
    border: 0;
    background: transparent;
    color: var(--sl-text-secondary);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .sl-tab[aria-selected="true"] {
    background: var(--sl-elevated);
    color: var(--sl-text);
  }
  .sl-imp-panel {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .sl-dropzone {
    border: 1.5px dashed var(--sl-line-strong);
    background: var(--sl-panel);
    border-radius: 16px;
    padding: 30px 18px;
    text-align: center;
    cursor: pointer;
    transition: border-color .15s ease, background .15s ease;
  }
  .sl-dropzone:hover, .sl-dropzone.dragover {
    border-color: var(--sl-green);
    background: rgba(74, 222, 128, .05);
  }
  .sl-dropzone-icon {
    width: 48px;
    height: 48px;
    border-radius: 12px;
    background: rgba(74, 222, 128, .12);
    color: var(--sl-green);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 10px;
  }
  .sl-card-flat {
    background: var(--sl-panel);
    border: 1px solid var(--sl-line);
    border-radius: 16px;
    padding: 16px 18px;
  }
  .sl-imp-files {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .sl-imp-file-card {
    background: var(--sl-panel);
    border: 1px solid var(--sl-line);
    border-radius: 16px;
    overflow: hidden;
  }
  .sl-imp-file-head {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 16px;
    border-bottom: 1px solid var(--sl-line-subtle);
  }
  .sl-file-icon-box {
    width: 38px;
    height: 38px;
    border-radius: 10px;
    background: rgba(74, 222, 128, .12);
    color: var(--sl-green);
    display: flex;
    align-items: center;
    justify-content: center;
    flex: none;
  }
  .sl-imp-summary {
    padding: 14px 16px;
    border-bottom: 1px solid var(--sl-line-subtle);
  }
  .sl-imp-big-num {
    font-size: 36px;
    font-weight: 700;
    letter-spacing: -.03em;
    line-height: 1.05;
    font-variant-numeric: tabular-nums;
  }
  .sl-imp-segbar {
    display: flex;
    gap: 3px;
    height: 8px;
    margin-top: 12px;
    border-radius: 999px;
    overflow: hidden;
    background: var(--sl-elevated);
  }
  .sl-imp-details {
    border-bottom: 1px solid var(--sl-line-subtle);
  }
  .sl-imp-details:last-child { border-bottom: 0; }
  .sl-imp-details summary {
    list-style: none;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 16px;
    cursor: pointer;
    font-size: 14px;
  }
  .sl-imp-details summary::-webkit-details-marker { display: none; }
  .sl-imp-details.danger { background: rgba(248, 113, 113, .08); }
  .sl-imp-details-body {
    padding: 0 16px 12px 34px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    font-size: 13px;
    color: var(--sl-text-secondary);
  }
  .sl-dot-ind {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex: none;
    display: inline-block;
  }
  .sl-imp-confirm-bar {
    display: flex;
    gap: 10px;
    margin-top: 14px;
    flex-wrap: wrap;
  }
  .sl-btn-lg {
    height: 48px;
    padding: 0 20px;
    border-radius: 14px;
    font-size: 15px;
  }
  .sl-imp-confirm-bar .sl-btn { flex: 1 1 220px; }
  .sl-progress-card {
    background: var(--sl-panel);
    border: 1px solid var(--sl-line-strong);
    border-radius: 14px;
    padding: 14px 16px;
    margin-top: 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .sl-progress-track {
    height: 8px;
    border-radius: 999px;
    background: var(--sl-elevated);
    overflow: hidden;
  }
  .sl-progress-fill {
    height: 100%;
    background: var(--sl-green);
    transition: width .2s ease;
  }
  .sl-alert-box {
    border-radius: 12px;
    padding: 12px 14px;
    font-size: 13px;
    line-height: 1.45;
    border: 1px solid var(--sl-line-strong);
    background: var(--sl-elevated);
  }
  .sl-alert-box.error {
    background: rgba(248, 113, 113, .12);
    border-color: rgba(248, 113, 113, .35);
    color: #FCA5A5;
  }
  .sl-alert-box.amber {
    background: rgba(251, 191, 36, .10);
    border-color: rgba(251, 191, 36, .30);
    color: #FDE68A;
  }
  .sl-alert-box.ok {
    background: rgba(74, 222, 128, .10);
    border-color: rgba(74, 222, 128, .30);
    color: #86EFAC;
  }
  .sl-textarea {
    width: 100%;
    margin-top: 12px;
    padding: 12px;
    border-radius: 12px;
    border: 1px solid var(--sl-line-strong);
    background: var(--sl-bg);
    color: var(--sl-text);
    font-family: var(--sl-mono);
    font-size: 12px;
    resize: vertical;
    outline: none;
  }
  .sl-checkbox-row {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    margin-top: 12px;
    padding: 10px 12px;
    border-radius: 10px;
    background: var(--sl-elevated);
    font-size: 13px;
    cursor: pointer;
  }
  .sl-count-pill {
    font-family: var(--sl-mono);
    font-size: 12px;
    font-weight: 600;
    background: var(--sl-elevated);
    border: 1px solid var(--sl-line-strong);
    color: var(--sl-text);
    border-radius: 999px;
    padding: 2px 9px;
  }
  .sl-pend-blocks {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .sl-pend-block-head {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 12px;
  }
  .sl-pend-block-title {
    margin: 0;
    font-size: 15px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .sl-pend-help {
    margin: 4px 0 0;
    font-size: 13px;
    color: var(--sl-text-secondary);
  }
  .sl-pend-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .sl-pend-item {
    background: var(--sl-bg);
    border: 1px solid var(--sl-line);
    border-radius: 12px;
    padding: 12px 14px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .sl-pend-item-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 10px;
    flex-wrap: wrap;
  }
  .sl-pend-lines {
    display: flex;
    flex-direction: column;
    gap: 4px;
    font-size: 13px;
    color: var(--sl-text-secondary);
  }
  .sl-pend-line-row {
    display: flex;
    justify-content: space-between;
    gap: 10px;
  }
  .sl-pend-actions {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    align-items: center;
    margin-top: 4px;
  }
  .sl-input-inline {
    height: 36px;
    padding: 0 10px;
    border-radius: 8px;
    border: 1px solid var(--sl-line-strong);
    background: var(--sl-panel);
    color: var(--sl-text);
    font-family: var(--sl-font);
    font-size: 13px;
    flex: 1 1 180px;
    min-width: 0;
  }
  .sl-select-inline {
    height: 38px;
    padding: 0 10px;
    border-radius: 8px;
    border: 1px solid var(--sl-line-strong);
    background: var(--sl-panel);
    color: var(--sl-text);
    font-family: var(--sl-font);
    font-size: 13px;
    min-width: 200px;
    max-width: 100%;
  }
  .sl-seguir-dialog {
    margin-top: 6px;
    padding: 12px;
    border-radius: 10px;
    background: var(--sl-elevated);
    border: 1px solid var(--sl-line-strong);
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .sl-btn-disabled-wrap {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--sl-text-label);
  }
  .sl-ghost:disabled, .sl-btn:disabled {
    opacity: .42;
    cursor: not-allowed;
  }
  .sl-si-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 12px;
    margin-top: 12px;
  }
  .sl-si-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
    margin-top: 8px;
  }
  .sl-si-table th, .sl-si-table td {
    padding: 7px 8px;
    border-bottom: 1px solid var(--sl-line-subtle);
    text-align: left;
  }
  .sl-si-table th {
    color: var(--sl-text-label);
    font-weight: 500;
    font-size: 12px;
  }
  .sl-si-table td.num, .sl-si-table th.num {
    text-align: right;
    font-family: var(--sl-mono);
  }

  /* Movimientos comunes */
  .sl-mov-list {
    border: 1px solid var(--sl-line-subtle);
    border-radius: 10px;
    overflow: hidden;
  }
  .sl-mov-row {
    display: grid;
    grid-template-columns: 32px minmax(0, 1fr) auto;
    gap: 12px;
    align-items: center;
    padding: 11px 16px;
    border-bottom: 1px solid var(--sl-line-subtle);
  }
  .sl-mov-row:last-child { border-bottom: 0; }
  .sl-mov-sym {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: var(--sl-elevated);
    border: 1px solid var(--sl-line-strong);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--sl-mono);
    font-size: 14px;
  }

  /* Panel lateral (ordenador) & Hoja inferior (móvil) */
  .sl-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, .52);
    z-index: 40;
  }

  .sl-drawer-panel {
    position: fixed;
    top: 0;
    right: 0;
    bottom: 0;
    width: min(420px, 100%);
    background: #0F0F11;
    border-left: 1px solid var(--sl-line-strong);
    box-shadow: -20px 0 60px rgba(0, 0, 0, .5);
    display: flex;
    flex-direction: column;
    z-index: 50;
  }

  .sl-sheet-panel {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    max-height: 82vh;
    background: var(--sl-panel);
    border-top: 1px solid var(--sl-line-strong);
    border-radius: 22px 22px 0 0;
    padding: 10px 16px 26px;
    display: flex;
    flex-direction: column;
    z-index: 50;
    overflow-y: auto;
  }

  .sl-partida-row {
    display: grid;
    grid-template-columns: 4px minmax(0, 1fr) auto;
    gap: 12px;
    align-items: center;
    padding: 12px 18px;
    border-bottom: 1px solid var(--sl-line-subtle);
    cursor: pointer;
    transition: background .1s ease;
    width: 100%;
    border-left: 0;
    border-right: 0;
    border-top: 0;
    background: transparent;
    color: var(--sl-text);
    text-align: left;
  }
  .sl-partida-row:hover { background: var(--sl-hover); }

  /* Partida con procedencia (05) */
  .sl-partida-page {
    max-width: 560px;
    margin: 0 auto;
    padding: 16px 16px 96px;
    width: 100%;
  }

  .sl-partida-card {
    margin-top: 14px;
    background: var(--sl-panel);
    border: 1px solid var(--sl-line);
    border-radius: 14px;
    padding: 20px;
  }

  .sl-partida-footer {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    padding: 12px 16px 18px;
    background: linear-gradient(to top, var(--sl-bg) 75%, rgba(10,10,11,0));
    z-index: 30;
  }
  .sl-partida-footer-inner {
    max-width: 528px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  /* Estados (09) */
  .sl-state-wrap {
    max-width: 520px;
    margin: 24px auto;
    padding: 0 16px;
  }
  .sl-state-card {
    background: var(--sl-bg);
    border: 1px solid var(--sl-line);
    border-radius: 14px;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .sl-offline-banner {
    display: flex;
    align-items: center;
    gap: 10px;
    background: rgba(251, 191, 36, .10);
    border: 1px solid rgba(251, 191, 36, .30);
    border-radius: 12px;
    padding: 10px 14px;
    font-size: 13px;
    color: var(--sl-amber);
    margin: 14px 16px 0;
  }

  /* Toast discreto */
  .sl-toast-container {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 100;
    display: flex;
    flex-direction: column;
    gap: 8px;
    pointer-events: none;
    width: max-content;
    max-width: calc(100vw - 32px);
  }
  .sl-toast {
    background: var(--sl-elevated);
    border: 1px solid var(--sl-line-strong);
    color: var(--sl-text);
    border-radius: 10px;
    padding: 10px 16px;
    font-size: 13px;
    font-weight: 500;
    box-shadow: 0 10px 30px rgba(0,0,0,.45);
  }
  .sl-toast.error { border-color: rgba(248, 113, 113, .4); color: var(--sl-red); }
  .sl-toast.success { border-color: rgba(74, 222, 128, .4); color: var(--sl-green); }

  .sl-mono { font-family: var(--sl-mono); font-variant-numeric: tabular-nums; }
  .sl-hidden { display: none !important; }

  /* Cuadre de la noche (T-040) */
  .sl-cuadre-page {
    max-width: 780px;
  }
  .sl-cuadre-cabecera {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  .sl-cuadre-cabecera-texto {
    flex: 1 1 220px;
    min-width: 0;
  }
  .sl-cuadre-progreso-wrap {
    flex: 0 1 180px;
    min-width: 150px;
  }
  .sl-cuadre-progreso-texto {
    display: block;
    margin-bottom: 6px;
    font-family: var(--sl-mono);
    font-size: 13px;
    color: var(--sl-text-secondary);
    text-align: right;
  }
  .sl-cuadre-progreso {
    height: 6px;
    border-radius: 999px;
    background: var(--sl-elevated);
    overflow: hidden;
  }
  .sl-cuadre-progreso-fill {
    display: block;
    width: 0;
    height: 100%;
    background: var(--sl-green);
    border-radius: inherit;
    transition: width .2s ease;
  }
  .sl-cuadre-cargando {
    background: var(--sl-panel);
    border: 1px solid var(--sl-line);
    border-radius: 16px;
    padding: 28px 18px;
    text-align: center;
    color: var(--sl-text-secondary);
    font-size: 13px;
  }
  .sl-cuadre-error {
    background: rgba(248, 113, 113, .08);
    border: 1px solid rgba(248, 113, 113, .35);
    color: var(--sl-red);
    border-radius: 12px;
    padding: 12px 14px;
    font-size: 13px;
    line-height: 1.45;
  }
  .sl-cuadre-hoja {
    background: var(--sl-panel);
    border: 1px solid var(--sl-line);
    border-radius: 18px;
    overflow: hidden;
  }
  .sl-cuadre-familia {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 16px 18px;
    border-bottom: 1px solid var(--sl-line);
  }
  .sl-cuadre-color {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    flex: none;
    background: var(--sl-brand);
  }
  .sl-cuadre-familia-texto {
    flex: 1 1 auto;
    min-width: 0;
  }
  .sl-cuadre-familia-nombre {
    margin: 0;
    font-size: 20px;
    font-weight: 700;
    letter-spacing: -.02em;
    line-height: 1.2;
  }
  .sl-cuadre-familia-meta {
    margin: 4px 0 0;
    font-size: 12px;
    color: var(--sl-text-secondary);
    line-height: 1.35;
  }
  .sl-cuadre-familia-cajas {
    flex: none;
    font-family: var(--sl-mono);
    font-size: 14px;
    font-weight: 700;
    color: var(--sl-text);
    white-space: nowrap;
  }
  .sl-cuadre-tabla {
    overflow-x: auto;
  }
  .sl-cuadre-fila {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 56px 68px 52px;
    align-items: center;
    gap: 8px;
    padding: 10px 14px;
    border-bottom: 1px solid var(--sl-line-subtle);
  }
  .sl-cuadre-fila:last-child {
    border-bottom: 0;
  }
  .sl-cuadre-fila-cabecera {
    padding-top: 8px;
    padding-bottom: 8px;
    font-size: 12px;
    color: var(--sl-text-secondary);
    text-transform: uppercase;
    letter-spacing: .05em;
  }
  .sl-cuadre-articulo {
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .sl-cuadre-articulo-nombre {
    font-size: 14px;
    font-weight: 600;
    line-height: 1.25;
    overflow-wrap: anywhere;
  }
  .sl-cuadre-articulo-envase {
    font-size: 12px;
    color: var(--sl-text-secondary);
    line-height: 1.25;
    overflow-wrap: anywhere;
  }
  .sl-cuadre-num {
    text-align: right;
    font-family: var(--sl-mono);
    font-variant-numeric: tabular-nums;
    font-size: 14px;
  }
  .sl-cuadre-deberia {
    color: var(--sl-text-secondary);
  }
  .sl-cuadre-hay {
    display: flex;
    justify-content: flex-end;
  }
  .sl-cuadre-input {
    width: 100%;
    height: 44px;
    padding: 0 8px;
    border-radius: 10px;
    border: 1px solid var(--sl-line-strong);
    background: var(--sl-elevated);
    color: var(--sl-text);
    font-family: var(--sl-mono);
    font-size: 16px;
    font-weight: 600;
    text-align: center;
    outline: none;
  }
  .sl-cuadre-input:focus-visible {
    border-color: var(--sl-text);
    outline: 2px solid var(--sl-text);
    outline-offset: 2px;
  }
  .sl-cuadre-dif {
    text-align: right;
    font-family: var(--sl-mono);
    font-size: 14px;
    font-weight: 700;
    white-space: nowrap;
  }
  .sl-cuadre-dif-ok {
    color: var(--sl-green);
  }
  .sl-cuadre-dif-cambio {
    color: var(--sl-amber);
  }
  .sl-cuadre-dif-error {
    color: var(--sl-red);
  }
  .sl-cuadre-resumen {
    margin: 0;
    padding: 12px 18px;
    border-top: 1px solid var(--sl-line);
    font-size: 13px;
    font-weight: 600;
    color: var(--sl-text-secondary);
    min-height: 44px;
    display: flex;
    align-items: center;
  }
  .sl-cuadre-aviso {
    margin: 0 14px 12px;
    padding: 12px 14px;
    border-radius: 12px;
    background: rgba(251, 191, 36, .10);
    border: 1px solid rgba(251, 191, 36, .35);
    color: var(--sl-amber);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }
  .sl-cuadre-aviso-texto {
    margin: 0;
    flex: 1 1 200px;
    font-size: 13px;
    line-height: 1.45;
  }
  .sl-cuadre-acciones {
    display: grid;
    grid-template-columns: minmax(0, .8fr) minmax(0, 1.2fr);
    gap: 10px;
    padding: 12px 14px 14px;
    border-top: 1px solid var(--sl-line);
    background: var(--sl-panel);
  }
  .sl-cuadre-acciones .sl-btn,
  .sl-cuadre-acciones .sl-ghost {
    height: 48px;
    font-size: 14px;
    width: 100%;
  }
  .sl-cuadre-final {
    background: var(--sl-panel);
    border: 1px solid var(--sl-line);
    border-radius: 18px;
    padding: 26px 20px 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 10px;
  }
  .sl-cuadre-final-icono {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: rgba(74, 222, 128, .12);
    color: var(--sl-green);
    font-size: 26px;
    font-weight: 700;
    display: flex;
    align-items: center;
